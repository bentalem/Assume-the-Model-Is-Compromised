# SupportPilot pipeline.
#
# Stage order follows SP-BUILD-001 §10 and the placement table in docs/09-test-plan.md §11. The
# ordering is deliberate: the cheap gates that protect the repository (secret scan, lint) run before
# anything is built, and the suites that need a running environment run last.
#
# Blocking is the default. A stage that reports but does not block teaches people to ignore it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------------------------------
  # Pre-commit equivalents. These must not need Docker, so a broken workflow fails in seconds.
  # ------------------------------------------------------------------------------------------
  guard:
    name: Secret scan and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan walks tracked files; a shallow clone is enough, but history matters if the
          # scan is ever extended to diffs.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Secret scan
        run: python scripts/scan_secrets.py --all

      - name: Install lint tooling
        run: pip install --no-cache-dir ruff==0.8.4

      - name: Lint
        run: ruff check services/ scripts/

      - name: Format check
        run: ruff format --check services/ scripts/

  # ------------------------------------------------------------------------------------------
  # Unit suites. TS-1, TS-2, TS-5 — per commit, per docs/09-test-plan.md §11.
  # ------------------------------------------------------------------------------------------
  unit:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        working-directory: services/api
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Run tests
        working-directory: services/api
        run: pytest -q --cov=supportpilot_api --cov-report=term-missing

  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -fsSL -o opa https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Policy tests
        run: opa test policy/supportpilot policy/tests -v

      # A bundle that does not parse, or whose rules conflict, must never be publishable.
      - name: Policy lint
        run: opa check --strict policy/supportpilot

  # ------------------------------------------------------------------------------------------
  # Supply chain. Runs alongside the unit suites; both must pass before anything is built.
  # ------------------------------------------------------------------------------------------
  supply-chain:
    name: Dependency and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit vendored wheels
        run: |
          pip install --no-cache-dir pip-audit==2.7.3
          # The vendored wheel set is what actually ships, so it is what gets audited — auditing
          # requirements.txt alone would miss a wheel that drifted from its pin.
          pip-audit --requirement services/api/requirements.txt --strict
          pip-audit --requirement services/worker/requirements.txt --strict
          pip-audit --requirement services/approval-portal/requirements.txt --strict

      - name: Confirm every wheel is pinned and vendored
        run: python scripts/check_vendored_wheels.py

      - name: Scan container base images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH

  # ------------------------------------------------------------------------------------------
  # Migration and RLS tests. These need a database but not the whole stack.
  # ------------------------------------------------------------------------------------------
  database:
    name: Migrations, grants and RLS
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4

      - name: Build the migration image
        run: docker build -t supportpilot/migrate:ci ./database

      - name: Apply migrations and run the smoke tests
        run: |
          docker network create sp-ci
          mkdir -p ci-secrets
          for name in postgres_bootstrap migrator api worker auditor; do
            openssl rand -base64 24 | tr -d '\n=' > "ci-secrets/${name}_password"
          done
          docker run -d --name pg --network sp-ci \
            -e POSTGRES_DB=supportpilot \
            -e POSTGRES_USER=supportpilot_admin \
            -e POSTGRES_PASSWORD="$(cat ci-secrets/postgres_bootstrap_password)" \
            postgres:16.4-alpine
          # The smoke tests inside the migration job are the assertion; a non-zero exit fails CI.
          docker run --rm --network sp-ci \
            -e DATABASE_HOST=pg -e DATABASE_PORT=5432 -e DATABASE_NAME=supportpilot \
            -e BOOTSTRAP_USER=supportpilot_admin \
            -e BOOTSTRAP_PASSWORD_FILE=/s/postgres_bootstrap_password \
            -e MIGRATOR_PASSWORD_FILE=/s/migrator_password \
            -e API_PASSWORD_FILE=/s/api_password \
            -e WORKER_PASSWORD_FILE=/s/worker_password \
            -e AUDITOR_PASSWORD_FILE=/s/auditor_password \
            -e SEED_LOCAL_DATA=true \
            -v "$PWD/ci-secrets:/s:ro" \
            supportpilot/migrate:ci

      - name: Confirm migrations are idempotent
        run: |
          # Re-running must be a no-op. A migration that is not re-runnable turns a redeploy into
          # an outage.
          docker run --rm --network sp-ci \
            -e DATABASE_HOST=pg -e DATABASE_PORT=5432 -e DATABASE_NAME=supportpilot \
            -e BOOTSTRAP_USER=supportpilot_admin \
            -e BOOTSTRAP_PASSWORD_FILE=/s/postgres_bootstrap_password \
            -e MIGRATOR_PASSWORD_FILE=/s/migrator_password \
            -e API_PASSWORD_FILE=/s/api_password \
            -e WORKER_PASSWORD_FILE=/s/worker_password \
            -e AUDITOR_PASSWORD_FILE=/s/auditor_password \
            -e SEED_LOCAL_DATA=true \
            -v "$PWD/ci-secrets:/s:ro" \
            supportpilot/migrate:ci

  # ------------------------------------------------------------------------------------------
  # The full environment: TS-6, TS-7, TS-8. Blocking before promotion.
  # ------------------------------------------------------------------------------------------
  environment:
    name: Environment, abuse and action suites
    runs-on: ubuntu-latest
    needs: [unit, policy, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bring up the stack
        run: python scripts/bootstrap_local.py

      - name: Environment checks (V-01 to V-16)
        run: python scripts/verify_local.py

      - name: Agent abuse suite (TS-7)
        run: python scripts/abuse_suite.py

      - name: Action and approval suite (TS-8)
        run: python scripts/action_suite.py

      - name: Restore drill (TS9-07, TS9-08)
        run: python scripts/backup_restore_drill.py drill

      - name: Action document matches the code
        run: python scripts/export_openapi.py --check

      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: evidence/
          retention-days: 90

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200
