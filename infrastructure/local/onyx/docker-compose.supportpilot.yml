# SupportPilot overlay for Onyx.
#
# Apply alongside Onyx's own compose files:
#
#   cd ~/.config/onyx/deployment
#   docker compose -f docker-compose.yml -f docker-compose.onyx-lite.yml \
#                  -f <path-to-this-file> up -d api_server
#
# It does two things Onyx cannot do for itself:
#
#   1. Joins api_server to SupportPilot's `app` network, so it can reach the action API at
#      http://api:8000 and Keycloak at https://keycloak:8443.
#   2. Mounts the local Keycloak certificate and points Python's TLS stack at it, so Onyx will
#      accept the identity provider. Scoped to this one certificate — verification stays on.
#
# Onyx refuses a plain-HTTP IdP (`https_only=True`, hardcoded in sso_url_guard.py) and applies the
# same rule to every endpoint the discovery document names, so both the certificate and the trust
# have to be real.

name: onyx

services:
  api_server:
    environment:
      # The combined bundle: public roots + the local Keycloak certificate.
      #
      # These variables REPLACE the trust store rather than adding to it. Pointing them at
      # keycloak.crt alone left Onyx trusting exactly one certificate, so Keycloak verified and
      # every model-provider call failed with CERTIFICATE_VERIFY_FAILED. Build it with
      # scripts/build_ca_bundle.py.
      #
      # Both variables, because Onyx's stack mixes httpx, requests and raw ssl contexts.
      - SSL_CERT_FILE=/etc/ssl/supportpilot/ca-bundle.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/supportpilot/ca-bundle.crt
      # Onyx's SSRF guard blocks RFC1918 addresses by default, and every address Keycloak can be
      # reached at from a container is private — the Docker network (172.x), the host's LAN
      # address (192.168.x), host.docker.internal. There is no public address to use, so a local
      # deployment cannot use an IdP at all without lowering this.
      #
      # This derives SSRFProtectionLevel.ALLOW_PRIVATE_NETWORK, which permits RFC1918 and keeps
      # loopback and cloud-metadata (169.254.0.0/16) blocked. It is not "SSRF off".
      #
      # It is a local-environment relaxation of Onyx's posture, recorded as AC-02 in
      # docs/10-risk-and-decisions.md so it is not carried into production unexamined.
      #
      # This seeds the *default*. A value saved in Admin Panel -> Security wins over it; if the
      # error persists after applying this, change it there instead.
      - MCP_SERVER_ALLOW_PRIVATE_NETWORK=true
    volumes:
      - ${SUPPORTPILOT_TLS_DIR:?set SUPPORTPILOT_TLS_DIR to the .secrets/tls path}:/etc/ssl/supportpilot:ro
    networks:
      - default
      - supportpilot_app

networks:
  supportpilot_app:
    external: true
