# Docker API proxy for the Range.
#
# Default deny. Three verbs, one closed list of container names, nothing else — including endpoints
# that do not exist yet, because a path this configuration has never heard of is refused rather than
# forwarded.
#
# The container list is here rather than in an environment variable on purpose: an allowlist the
# Range could influence is not an allowlist. Changing it is a file change in this repository and a
# control-plane change in the lab's own terms.

global
    log stdout format raw local0 info
    maxconn 64

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend docker_api
    bind :2375

    # The three containers a challenge may stop and start. Nothing else in the stack is reachable,
    # and postgres is deliberately absent: a challenge that needs the database down is a challenge
    # that needs a different design.
    acl allowed_container path_reg ^/(v[0-9.]+/)?containers/(supportpilot-opa|supportpilot-worker|supportpilot-api)/(stop|start|json)$

    acl is_stop  method POST
    acl is_start method POST
    acl is_read  method GET

    # Read state, or change run state. That is the whole surface.
    acl verb_ok  method GET POST

    http-request deny deny_status 403 unless allowed_container
    http-request deny deny_status 405 unless verb_ok

    # Explicitly refuse the endpoints that turn container control into host control, in case a
    # future Docker version routes one of them under a path the allowlist above would match.
    http-request deny deny_status 403 if { path_sub /exec }
    http-request deny deny_status 403 if { path_sub /archive }
    http-request deny deny_status 403 if { path_sub /attach }
    http-request deny deny_status 403 if { path_sub /update }

    default_backend docker_socket

backend docker_socket
    server dockersocket /var/run/docker.sock
