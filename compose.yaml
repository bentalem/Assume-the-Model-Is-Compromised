# SupportPilot local environment.
#
# Network boundaries are the point of this file (SP-ARCH-001 §8). A service is attached only to the
# networks it must reach. PostgreSQL and OPA are on internal networks with no route to the edge, and
# check V-02 proves it.
#
#   docker compose up -d                   SupportPilot + Keycloak + OPA + PostgreSQL
#   docker compose --profile onyx up -d    adds Onyx (see LAB.md, Part B)

name: supportpilot

x-postgres-image: &postgres-image postgres:16.4-alpine
x-python-base: &python-base
  restart: unless-stopped
  stop_grace_period: 10s

networks:
  # Reverse proxy and user-facing services only.
  edge:
    driver: bridge
  # Onyx -> API, approval portal -> API.
  app:
    driver: bridge
    internal: true
  # API -> OPA. Nothing else may reach the policy decision point.
  policy:
    driver: bridge
    internal: true
  # API and worker -> PostgreSQL.
  data:
    driver: bridge
    internal: true
  # Range -> the container proxy, and nothing else.
  control:
    driver: bridge
    internal: true
  # Range -> PostgreSQL, and nothing else.
  #
  # The Range cannot simply join `data`: the API is on `data` too, and sharing it would let the
  # Range reach the API. V-17 caught exactly that during the first run of this file, which is the
  # argument for writing the boundary check before the service has any authority to abuse.
  range_data:
    driver: bridge
    internal: true
  # Track 9. The memory service and its stores, and nothing else. Internal: no route to the edge,
  # and nothing on it is published to the host.
  memory_data:
    driver: bridge
    internal: true
  # The Range -> memory-db (functions only) and Qdrant (a read-only key only). Its own network for
  # the reason range_data is: joining memory_data would let the Range reach the memory service.
  range_memory:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  memory_db_data:
  qdrant_data:
  # The policy bundle OPA actually loads. It is a volume rather than the repository directory
  # because challenge 3.3 arms a permissive policy, and a mutation that wrote to the working tree
  # could leave a crashed container's permissive authorization checked out on disk. The volume is
  # repopulated from ./policy/supportpilot on every `compose up` by opa-bundle-init, so editing the
  # policy in the repository still works the way it always did.
  opa_bundle:
  # The delegation broker's lab switches (track 1, 1.5 - 1.8): read-only to the broker, read-write to
  # the Range, the same shape as opa_bundle. Empty means every switch at its secure value.
  broker_settings:

services:
  # --------------------------------------------------------------------------------------------
  # Data layer
  # --------------------------------------------------------------------------------------------
  postgres:
    image: *postgres-image
    container_name: supportpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-supportpilot}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-supportpilot_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      # Deterministic ordering for tests; avoids locale-dependent sort results.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    secrets:
      - postgres_bootstrap_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
      # The Range reaches PostgreSQL here rather than on `data`, so that joining the database does
      # not also join everything else attached to it.
      - range_data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-supportpilot_admin} -d ${DATABASE_NAME:-supportpilot}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot job. Owns the schema; runtime services never receive this credential.
  migrate:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: supportpilot/migrate:local
    container_name: supportpilot-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-supportpilot}
      BOOTSTRAP_USER: ${POSTGRES_BOOTSTRAP_USER:-supportpilot_admin}
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_db_password
      API_PASSWORD_FILE: /run/secrets/api_db_password
      WORKER_PASSWORD_FILE: /run/secrets/worker_db_password
      AUDITOR_PASSWORD_FILE: /run/secrets/auditor_db_password
      RANGE_PASSWORD_FILE: /run/secrets/range_db_password
      # Migration 0029 creates the one core role the memory service connects as. The role exists
      # in every install; nothing connects as it unless the `memory` profile is up.
      MEMORY_LOOKUP_PASSWORD_FILE: /run/secrets/memory_lookup_db_password
      SEED_LOCAL_DATA: ${SEED_LOCAL_DATA:-true}
    secrets:
      - postgres_bootstrap_password
      - migrator_db_password
      - api_db_password
      - worker_db_password
      - auditor_db_password
      - range_db_password
      - memory_lookup_db_password
    networks:
      - data

  # --------------------------------------------------------------------------------------------
  # Policy decision point. Private network only; no published port.
  # --------------------------------------------------------------------------------------------
  # --------------------------------------------------------------------------------------------
  # Populates OPA's bundle volume from the repository, before OPA starts, on every `compose up`.
  #
  # This exists so that the bundle OPA loads is a volume rather than a bind mount of the working
  # tree. Challenge 3.3 arms a permissive policy by replacing the file in that volume; doing the
  # same thing to the working tree would mean a container that died mid-challenge left a permissive
  # authorization policy checked out in somebody's git clone.
  #
  # It copies on every start, so `compose up` after editing policy/supportpilot/authz.rego behaves
  # exactly as it did when OPA bind-mounted that directory. It also means a bundle left armed by a
  # crash is corrected by a restart of the lab, independently of the Range's own restore path.
  # --------------------------------------------------------------------------------------------
  opa-bundle-init:
    image: alpine:3.20
    container_name: supportpilot-opa-bundle-init
    restart: "no"
    # The Range writes this volume when challenge 3.3 is armed, and it runs unprivileged as
    # uid 10004. Ownership is set here, once, rather than by widening the file mode: 0666 on a
    # policy bundle would let anything that can reach the volume rewrite authorization.
    command:
      - "sh"
      - "-c"
      - "cp -f /source/*.rego /source/*.json /bundle/ && chown -R 10004:999 /bundle && chmod 0644 /bundle/* && ls -1 /bundle"
    volumes:
      - ./policy/supportpilot:/source:ro
      - opa_bundle:/bundle
    networks:
      - policy

  opa:
    image: openpolicyagent/opa:1.4.2-static
    container_name: supportpilot-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--set=decision_logs.console=true"
      - "/policy"
    depends_on:
      opa-bundle-init:
        condition: service_completed_successfully
    volumes:
      # Read-only to OPA: it never writes policy, and it is not the component that arms 3.3.
      - opa_bundle:/policy:ro
    networks:
      - policy
    healthcheck:
      # The static image carries no shell or HTTP client, so the check evaluates the bundle
      # directly. Reachability of the OPA server is covered by the API's /readyz.
      test: ["CMD", "/opa", "eval", "--data", "/policy", "data.supportpilot.authz.health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # --------------------------------------------------------------------------------------------
  # Identity
  # --------------------------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: supportpilot-keycloak
    restart: unless-stopped
    # Keycloak 26 reads the bootstrap password only from KC_BOOTSTRAP_ADMIN_PASSWORD, with no
    # _FILE variant. The wrapper reads the mounted secret and exports it into Keycloak's own
    # process, so the value still never appears in compose, the image, or `docker inspect`.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm \
             --http-port=8080 --https-port=8443
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HOSTNAME_STRICT: "false"
      # One canonical issuer regardless of how Keycloak is reached. Without this, a token fetched
      # from the host carries iss=localhost:8080 while a token fetched from a container carries
      # iss=keycloak:8080, and the API can only ever accept one of them. The API validates against
      # this issuer but fetches keys over the internal network (KEYCLOAK_JWKS_URL), which is what
      # backchannel-dynamic allows.
      # HTTPS, because Onyx refuses a plain-HTTP identity provider and SP-ARCH-001 §8 asks
      # for internal HTTPS regardless. The certificate covers both names, so the browser reaching
      # localhost and containers reaching keycloak validate against the same file.
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/keycloak.key
      # `keycloak`, not `localhost`, and this is the subtle part.
      #
      # Onyx guards every endpoint the discovery document names, and ALLOW_PRIVATE_NETWORK still
      # blocks loopback — so a document advertising a localhost authorization_endpoint is refused
      # even though the discovery URL itself was accepted. Naming the service instead makes every
      # endpoint resolve to a private Docker address inside the container, which is allowed, and
      # keeps loopback blocked rather than switching the guard off.
      #
      # The browser needs `keycloak` to resolve too: add `127.0.0.1 keycloak` to the hosts file.
      # Keycloak stays bound to 127.0.0.1, so nothing is exposed to the LAN.
      KC_HOSTNAME: https://keycloak:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    secrets:
      - keycloak_admin_password
    volumes:
      # Identity configuration lives in this read-only file so it is reproducible and reviewable.
      #
      # Read the next sentence carefully, because an earlier version of this comment was wrong and
      # cost an hour: `docker compose restart keycloak` does NOT re-import. Keycloak logs
      # "Realm 'supportpilot' already exists. Import skipped" and keeps whatever is in its embedded
      # database, so an edit to this file has no effect at all.
      #
      #     docker compose up -d --force-recreate keycloak
      #
      # is what applies a change, because a new container gets a new embedded database and the
      # import runs with OVERWRITE_EXISTING. Changes made in the admin console survive a restart and
      # are lost on a recreate, which is the opposite of what the old comment claimed.
      - ./infrastructure/local/keycloak:/opt/keycloak/data/import:ro
      - ./.secrets/tls:/opt/keycloak/conf/tls:ro
    ports:
      # Local only. The user-facing login flow and the token endpoint the test harness calls.
      # 8080 stays published so the plain-HTTP harness keeps working; 8443 is what Onyx uses.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    networks:
      - edge
      - app
    healthcheck:
      # A TCP connect to the HTTPS listener, and nothing more.
      #
      # Enabling TLS moves Keycloak's management interface to HTTPS on 9000, and this image ships
      # with no curl, wget, python or openssl — so an in-container check of /health/ready is not
      # available. Rather than a check that looks precise and silently tests nothing, this asserts
      # exactly what it can: the TLS port is listening.
      #
      # Real readiness — the realm is imported and serving discovery — is asserted from the host by
      # scripts/bootstrap_local.py, which can use a TLS client.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --------------------------------------------------------------------------------------------
  # SupportPilot API. Reaches Keycloak (app), OPA (policy), PostgreSQL (data).
  # Not on the edge network: Onyx and the approval portal reach it over `app`.
  # --------------------------------------------------------------------------------------------
  api:
    <<: *python-base
    build:
      # Context is the repository root so the vendored wheel set is shared by every service.
      context: .
      dockerfile: services/api/Dockerfile
    image: supportpilot/api:local
    container_name: supportpilot-api
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SUPPORTPILOT_ENV: local
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://keycloak:8443/realms/supportpilot}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-https://keycloak:8443/realms/supportpilot/protocol/openid-connect/certs}
      SUPPORTPILOT_AUDIENCE: ${SUPPORTPILOT_AUDIENCE:-supportpilot-api}
      # The second trusted issuer: the delegation broker (profile `delegation`, track 1 1.5 - 1.8).
      # Its tokens must carry `act`, ES256 only, five minutes at most. With the profile down the key
      # set cannot be fetched and every broker token is refused; Keycloak tokens are unaffected.
      # Trusting an issuer is a privilege grant — docs/architecture/README.md records this one.
      BROKER_ISSUER: http://broker:8097
      BROKER_JWKS_URL: http://broker:8097/.well-known/jwks.json
      TOKEN_LEEWAY_SECONDS: ${TOKEN_LEEWAY_SECONDS:-30}
      OPA_URL: ${OPA_URL:-http://opa:8181/v1/data/supportpilot/authz/decision}
      OPA_TIMEOUT_MS: ${OPA_TIMEOUT_MS:-250}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-supportpilot}
      DATABASE_USER: sp_api_role
      API_DATABASE_SECRET_FILE: /run/secrets/api_db_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Public roots plus the local Keycloak certificate, for the JWKS fetch. Naming
      # keycloak.crt directly would replace the trust store rather than extend it, leaving the
      # API unable to verify anything else it might ever need to reach.
      SSL_CERT_FILE: /etc/ssl/supportpilot/ca-bundle.crt
    volumes:
      - ./.secrets/tls:/etc/ssl/supportpilot:ro
    secrets:
      - api_db_password
    # No published port, deliberately. The API is reachable only from the internal `app` network
    # (Onyx and the approval portal). Publishing a host port here would not even work — every
    # network the API is attached to is internal — and it would contradict SP-ARCH-001 §8, which
    # puts the API behind the reverse proxy rather than on the user network.
    #
    # verify-local.ps1 therefore calls the API from inside a container on `app`, which is also a
    # more faithful test: it exercises the path Onyx actually uses.
    networks:
      - app
      - policy
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # --------------------------------------------------------------------------------------------
  # Worker. Data network only: no inbound, and no route to OPA or the edge.
  # The only component that executes a refund, and only one that was approved.
  # --------------------------------------------------------------------------------------------
  worker:
    <<: *python-base
    build:
      # Context is the repository root so the vendored wheel set is shared by every service.
      context: .
      dockerfile: services/worker/Dockerfile
    image: supportpilot/worker:local
    container_name: supportpilot-worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SUPPORTPILOT_ENV: local
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-supportpilot}
      DATABASE_USER: sp_worker_role
      WORKER_DATABASE_SECRET_FILE: /run/secrets/worker_db_password
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - worker_db_password
    networks:
      - data

  # --------------------------------------------------------------------------------------------
  # Approval portal. Edge for approvers, app to reach the API. No database access at all.
  # --------------------------------------------------------------------------------------------
  approval-portal:
    <<: *python-base
    build:
      # Context is the repository root so the vendored wheel set is shared by every service.
      context: .
      dockerfile: services/approval-portal/Dockerfile
    image: supportpilot/approval-portal:local
    container_name: supportpilot-approval
    depends_on:
      api:
        condition: service_started
    environment:
      SUPPORTPILOT_ENV: local
      SUPPORTPILOT_API_URL: http://api:8000
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://keycloak:8443/realms/supportpilot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - edge
      - app

  # --------------------------------------------------------------------------------------------
  # The Range — the practice surface.
  #
  # It arms the lab's controls into broken states so a learner can watch the consequence, which
  # makes it the largest piece of authority in this file. Read its boundaries here rather than
  # taking them on trust:
  #
  #   * `edge`, `range_data` and `control`. NOT on `app` or `policy`, and NOT on `data` — the API
  #     is on `data`, so sharing it would have handed the Range a route to the API. V-17 proves it.
  #     Track 9 adds `range_memory` (memory-db and Qdrant only), and NOT `memory_data`, where the
  #     memory service and the embedding model are. V-27 proves that.
  #   * Its database role owns nothing and holds no privilege on any table (migration 0010).
  #   * It is absent from openapi/supportpilot-actions.*, so the model has no route that names it.
  #   * SUPPORTPILOT_ENV must be `local` or the process exits before it binds a port.
  #
  # Profile-gated: a lab that is only being used as a lab does not need it running.
  # --------------------------------------------------------------------------------------------
  range:
    <<: *python-base
    profiles: ["range"]
    build:
      context: .
      dockerfile: services/range/Dockerfile
    image: supportpilot/range:local
    container_name: supportpilot-range
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker-settings-init:
        condition: service_completed_successfully
    environment:
      SUPPORTPILOT_ENV: local
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-supportpilot}
      RANGE_DB_USER: sp_range_role
      RANGE_DB_PASSWORD_FILE: /run/secrets/range_db_password
      RANGE_CONTENT_DIR: /app/content
      DOCKER_PROXY_URL: http://docker-proxy:2375
      RANGE_REPO_DIR: /repo
      PROBE_URL: http://probe:8096
      PROBE_SHARED_SECRET_FILE: /run/secrets/probe_shared_secret
      # Track 9. memory-db as mem_range_role (the range_mem functions and nothing else), and Qdrant
      # with a read-only token per collection. Both only when the memory profile is up; without it
      # the eight memory controls read `absent` and the rest of the Range is unchanged.
      MEMORY_DB_HOST: memory-db
      RANGE_MEMORY_DB_PASSWORD_FILE: /run/secrets/range_memory_db_password
      QDRANT_URL: http://qdrant:6333
      RANGE_QDRANT_TOKEN_DIR: /run/secrets
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - range_db_password
      - probe_shared_secret
      # Track 9 grants, named as grants: memory-db's Range role, and read on each vector collection.
      # No write to the vector store, no API key, and no route to the memory service (V-27).
      - range_memory_db_password
      - range_qdrant_cedar_ro
      - range_qdrant_northwind_ro
      - range_qdrant_shared_ro
    volumes:
      # Stage 03 shows the lab's own source with its real path and line numbers, read at request
      # time so the material cannot drift from the system. Read-only, named one by one — mounting the
      # repository root would have handed the Range .secrets/, which is the whole reason this is a
      # list rather than a single line. The list must match ALLOWED_PREFIXES in source.py; a count
      # in this comment went stale the first time the set grew, so there is no longer a count.
      - ./database:/repo/database:ro
      - ./services:/repo/services:ro
      - ./policy:/repo/policy:ro
      - ./scripts:/repo/scripts:ro
      # The action document. Track 4 is about reading a tool schema and judging the authority it
      # grants, so the learner needs the real registered surface rather than a description of it.
      - ./openapi:/repo/openapi:ro
      # OPA's bundle, read-write, for challenge 3.3 alone. This is the largest single grant the
      # Range holds and it is worth naming as one: with it, this service decides what the policy
      # engine believes. Two things bound it. The permissive policy is derived from the read-only
      # copy above rather than stored, so it is always the real policy minus one named condition.
      # And it is a volume, so a container that dies mid-challenge cannot leave a permissive policy
      # in the working tree — `compose up` repopulates it from the repository.
      - opa_bundle:/opa-bundle
      # The delegation broker's switches, read-write, for challenges 1.5, 1.7 and 1.8. Three
      # booleans the broker reads on every request; each is a configuration a real deployment might
      # ship. What the Range can do with it is bounded by what the broker accepts: never a scope
      # that is not in the table, never refunds:approve, never a ceiling the profiles file lacks.
      - broker_settings:/broker-settings
    ports:
      - "127.0.0.1:8095:8095"
    networks:
      - edge
      - range_data
      - control
      - range_memory

  # --------------------------------------------------------------------------------------------
  # The probe service — a fixed vocabulary of API requests, for the Range.
  #
  # The Range cannot reach the API (V-17) and twelve challenges need a request made through it.
  # This service can reach the API, holds one hand-written list of requests, and answers to an id.
  # See docs/architecture/the-range.md.
  #
  # It is on `app` because it must reach the API, which means anything else on `app` can open a
  # socket to it. Network placement alone cannot make the direction one-way, so the shared secret
  # does: it is mounted to this service and to the Range, and to nothing else.
  # --------------------------------------------------------------------------------------------
  probe:
    <<: *python-base
    profiles: ["range"]
    build:
      context: .
      dockerfile: services/probe/Dockerfile
    image: supportpilot/probe:local
    container_name: supportpilot-probe
    depends_on:
      api:
        condition: service_started
    environment:
      SUPPORTPILOT_ENV: local
      SUPPORTPILOT_API_URL: http://api:8000
      # Track 9's fixed scenarios. Reached on `app`, as the seeded users, like the API.
      SUPPORTPILOT_MEMORY_URL: http://memory:8000
      # Track 1, 1.5 - 1.8. The probe plays the agent platform and the compromised agent, holding a
      # profile's credential exactly as an agent would.
      BROKER_URL: http://broker:8097
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://keycloak:8443}
      KEYCLOAK_REALM: supportpilot
      PROBE_SHARED_SECRET_FILE: /run/secrets/probe_shared_secret
      SSL_CERT_FILE: /etc/ssl/supportpilot/ca-bundle.crt
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - probe_shared_secret
      - broker_profile_status_helper
      - broker_profile_refund_assistant
    volumes:
      - ./.secrets/tls:/etc/ssl/supportpilot:ro
    networks:
      - app
      - control

  # --------------------------------------------------------------------------------------------
  # The delegation broker — architecture D, down-scoped delegation (track 1, 1.5 - 1.8).
  #
  # Onyx keeps calling the API directly with the user's token (architecture C); nothing about that
  # changes. An agent registered with a profile's action document calls through here instead, and
  # the API receives a token naming the user *and* the agent, narrowed to what the call needs.
  #
  # It holds a signing key, so it is an issuer the API trusts: a privilege grant, recorded as one in
  # docs/architecture/README.md. It holds no database credential and no user password. On `app`
  # only, because it must reach Keycloak's key set and the API, and the API and the probe must reach
  # it. Not published.
  # --------------------------------------------------------------------------------------------
  broker:
    <<: *python-base
    profiles: ["delegation"]
    build:
      context: .
      dockerfile: services/broker/Dockerfile
    image: supportpilot/broker:local
    container_name: supportpilot-broker
    depends_on:
      keycloak:
        condition: service_healthy
      broker-settings-init:
        condition: service_completed_successfully
    environment:
      SUPPORTPILOT_ENV: local
      BROKER_ISSUER: http://broker:8097
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://keycloak:8443/realms/supportpilot}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-https://keycloak:8443/realms/supportpilot/protocol/openid-connect/certs}
      SUPPORTPILOT_AUDIENCE: ${SUPPORTPILOT_AUDIENCE:-supportpilot-api}
      SUPPORTPILOT_API_URL: http://api:8000
      BROKER_SCOPES_FILE: /etc/broker/scopes.json
      BROKER_PROFILES_FILE: /etc/broker/profiles.json
      BROKER_SIGNING_KEY_FILE: /run/secrets/broker_signing_key
      BROKER_SETTINGS_FILE: /broker-settings/settings.json
      SSL_CERT_FILE: /etc/ssl/supportpilot/ca-bundle.crt
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - broker_signing_key
      - broker_profile_status_helper
      - broker_profile_refund_assistant
    volumes:
      - ./.secrets/tls:/etc/ssl/supportpilot:ro
      # The scope table is the policy's own file, so the broker and the policy cannot disagree.
      - ./policy/supportpilot/scopes.json:/etc/broker/scopes.json:ro
      - ./infrastructure/local/broker/profiles.json:/etc/broker/profiles.json:ro
      - broker_settings:/broker-settings:ro
    networks:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8097/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Hands the settings volume to the Range's uid, once, the way opa-bundle-init hands it the policy
  # bundle: ownership rather than a world-writable mode. In both profiles, because either the Range
  # or the broker may be the first to mount it.
  broker-settings-init:
    image: alpine:3.20
    profiles: ["range", "delegation"]
    container_name: supportpilot-broker-settings-init
    restart: "no"
    command: ["sh", "-c", "chown 10004:10004 /broker-settings && chmod 0755 /broker-settings"]
    volumes:
      - broker_settings:/broker-settings
    network_mode: none

  # The only thing else on `control`. See infrastructure/local/docker-proxy/README.md for why the Range
  # does not get the Docker socket itself: a service holding that socket is root on the host, which
  # is not a smaller version of what the Range needs but an unbounded version of it.
  docker-proxy:
    profiles: ["range"]
    image: haproxy:2.9-alpine
    container_name: supportpilot-docker-proxy
    restart: unless-stopped
    read_only: true
    user: root
    volumes:
      - ./infrastructure/local/docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control

  # Onyx is NOT defined here.
  #
  # It ships as its own compose project (`name: onyx`) built from the upstream base file plus the
  # onyx-lite overlay, so vendoring a copy of it here would fork someone else's deployment. The
  # earlier profile in this file referenced an `onyx-lite` image that does not exist — Lite is an
  # overlay, not an image.
  #
  # `python scripts/connect_onyx.py` joins a running Onyx to the `app` network below and configures
  # the Keycloak client it needs. See docs/runbooks/onyx-integration.md.

# ------------------------------------------------------------------------------------------------
# Secrets are files outside the repository tree. Each service mounts only its own (SP-DATA-001 §10).
# ------------------------------------------------------------------------------------------------
  # --------------------------------------------------------------------------------------------
  # Track 9 — the memory stack. Profile-gated: a plain `docker compose up` is unchanged.
  #
  #   docker compose --profile memory up -d
  #
  # A memory layer beside the agent, the way organisations deploy one, and its own trust boundary.
  # It changes nothing in the core: Keycloak, the API, the core database, OPA, the worker and the
  # approval portal keep exactly their behaviour. Its one touch on the core is migration 0029, a
  # role that may call app.resolve_subject and nothing else. See docs/architecture/.
  # --------------------------------------------------------------------------------------------
  memory-db:
    image: *postgres-image
    container_name: supportpilot-memory-db
    profiles: ["memory"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/memory_db_bootstrap_password
    secrets:
      - memory_db_bootstrap_password
    volumes:
      - memory_db_data:/var/lib/postgresql/data
    # Not published. Reachable from the memory service and memory-init, and from the Range for its
    # functions — nothing else.
    networks:
      - memory_data
      - range_memory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_admin -d memory"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Long-term memory's vector store. Its API key is held by memory-init alone; every other component
  # gets a JWT scoped to the collections it needs (bootstrap mints them). JWT access control is on,
  # so a token for one tenant's collection gets 403 on another's — measured in this pinned version.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: supportpilot-qdrant
    profiles: ["memory"]
    restart: unless-stopped
    # Qdrant reads its API key only from an environment variable. The wrapper exports it from the
    # mounted secret into Qdrant's own process, so it never appears in compose or `docker inspect`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export QDRANT__SERVICE__API_KEY="$$(cat /run/secrets/qdrant_admin_key)"
        exec ./entrypoint.sh
    environment:
      QDRANT__SERVICE__JWT_RBAC: "true"
      QDRANT__TELEMETRY_DISABLED: "true"
    secrets:
      - qdrant_admin_key
    volumes:
      - qdrant_data:/qdrant/storage
    # Not published. memory_data for the memory service and memory-init; range_memory so the Range
    # can read, with a read-only token per collection.
    networks:
      - memory_data
      - range_memory
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The embedding model, local and offline: fetched at build time at a pinned revision with every
  # file hash-checked, and run with the hub disabled. No key, no egress, and memory_data only —
  # nothing outside the memory stack can reach it.
  embeddings:
    build:
      context: .
      dockerfile: services/embeddings/Dockerfile
    image: supportpilot/embeddings:local
    container_name: supportpilot-embeddings
    profiles: ["memory"]
    restart: unless-stopped
    networks:
      - memory_data
    healthcheck:
      # TEI opens its port only once the model is loaded, so an open port means ready.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot, like `migrate`: roles, schema, row-level security, seeds, smoke tests. The only holder
  # of memory-db's bootstrap credential.
  memory-init:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    image: supportpilot/memory:local
    container_name: supportpilot-memory-init
    profiles: ["memory"]
    restart: "no"
    command: ["supportpilot-memory-init"]
    depends_on:
      memory-db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    environment:
      MEMORY_DB_HOST: memory-db
      MEMORY_DB_NAME: memory
      MEMORY_DB_BOOTSTRAP_USER: memory_admin
      QDRANT_URL: http://qdrant:6333
      QDRANT_ADMIN_KEY_FILE: /run/secrets/qdrant_admin_key
      EMBEDDINGS_URL: http://embeddings:80
      MEMORY_TENANTS: ${MEMORY_TENANTS:-11111111-1111-1111-1111-111111111111:cedar,22222222-2222-2222-2222-222222222222:northwind}
      MEMORY_DB_BOOTSTRAP_SECRET_FILE: /run/secrets/memory_db_bootstrap_password
      MEMORY_MIGRATOR_SECRET_FILE: /run/secrets/memory_migrator_db_password
      MEMORY_SERVICE_SECRET_FILE: /run/secrets/memory_db_password
      MEMORY_RANGE_SECRET_FILE: /run/secrets/range_memory_db_password
      SEED_LOCAL_DATA: ${SEED_LOCAL_DATA:-true}
    secrets:
      - memory_db_bootstrap_password
      - memory_migrator_db_password
      - memory_db_password
      - range_memory_db_password
      # The only holder of Qdrant's API key outside Qdrant itself.
      - qdrant_admin_key
    networks:
      - memory_data

  memory:
    <<: *python-base
    image: supportpilot/memory:local
    container_name: supportpilot-memory
    profiles: ["memory"]
    depends_on:
      memory-db:
        condition: service_healthy
      memory-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SUPPORTPILOT_ENV: local
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://keycloak:8443/realms/supportpilot}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-https://keycloak:8443/realms/supportpilot/protocol/openid-connect/certs}
      # Its own audience. A token minted only for the API is refused here — challenge 1.2's lesson,
      # applied to a second resource server.
      MEMORY_AUDIENCE: supportpilot-memory
      TOKEN_LEEWAY_SECONDS: ${TOKEN_LEEWAY_SECONDS:-30}
      MEMORY_DB_HOST: memory-db
      MEMORY_DB_NAME: memory
      MEMORY_DB_USER: mem_service_role
      MEMORY_DB_SECRET_FILE: /run/secrets/memory_db_password
      # The core database, as the role that may call app.resolve_subject and nothing else.
      CORE_DB_HOST: postgres
      CORE_DB_NAME: ${DATABASE_NAME:-supportpilot}
      CORE_DB_USER: sp_memory_lookup_role
      CORE_DB_SECRET_FILE: /run/secrets/memory_lookup_db_password
      QDRANT_URL: http://qdrant:6333
      QDRANT_JWT_DIR: /run/secrets
      EMBEDDINGS_URL: http://embeddings:80
      MEMORY_TENANTS: ${MEMORY_TENANTS:-11111111-1111-1111-1111-111111111111:cedar,22222222-2222-2222-2222-222222222222:northwind}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SSL_CERT_FILE: /etc/ssl/supportpilot/ca-bundle.crt
    volumes:
      - ./.secrets/tls:/etc/ssl/supportpilot:ro
    secrets:
      - memory_db_password
      - memory_lookup_db_password
      # A token per tenant collection, and one for the shared collection because the service
      # dual-writes both layouts. Never the API key.
      - qdrant_jwt_cedar
      - qdrant_jwt_northwind
      - qdrant_jwt_shared
    # No published port. `app` is how the agent (and the probe, playing the runtime) reach it;
    # `memory_data` is its own stores; `data` is the core database, for the principal lookup only.
    networks:
      - app
      - memory_data
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

secrets:
  postgres_bootstrap_password:
    file: ./.secrets/postgres_bootstrap_password
  migrator_db_password:
    file: ./.secrets/migrator_db_password
  api_db_password:
    file: ./.secrets/api_db_password
  worker_db_password:
    file: ./.secrets/worker_db_password
  auditor_db_password:
    file: ./.secrets/auditor_db_password
  range_db_password:
    file: ./.secrets/range_db_password
  # Track 9 — the memory stack. Only memory_lookup_db_password is used outside the `memory`
  # profile, by the core migration job above.
  memory_lookup_db_password:
    file: ./.secrets/memory_lookup_db_password
  memory_db_bootstrap_password:
    file: ./.secrets/memory_db_bootstrap_password
  memory_migrator_db_password:
    file: ./.secrets/memory_migrator_db_password
  memory_db_password:
    file: ./.secrets/memory_db_password
  range_memory_db_password:
    file: ./.secrets/range_memory_db_password
  qdrant_admin_key:
    file: ./.secrets/qdrant_admin_key
  qdrant_jwt_cedar:
    file: ./.secrets/qdrant_jwt_cedar
  qdrant_jwt_northwind:
    file: ./.secrets/qdrant_jwt_northwind
  qdrant_jwt_shared:
    file: ./.secrets/qdrant_jwt_shared
  # The Range's read-only view of the vector store: `r` on one collection each (track 9).
  range_qdrant_cedar_ro:
    file: ./.secrets/range_qdrant_cedar_ro
  range_qdrant_northwind_ro:
    file: ./.secrets/range_qdrant_northwind_ro
  range_qdrant_shared_ro:
    file: ./.secrets/range_qdrant_shared_ro
  probe_shared_secret:
    file: ./.secrets/probe_shared_secret
  # Track 1, 1.5 - 1.8. The signing key to the broker alone; each profile credential to the broker
  # and the probe, which plays the agent that holds it.
  broker_signing_key:
    file: ./.secrets/broker_signing_key
  broker_profile_status_helper:
    file: ./.secrets/broker_profile_status_helper
  broker_profile_refund_assistant:
    file: ./.secrets/broker_profile_refund_assistant
  keycloak_admin_password:
    file: ./.secrets/keycloak_admin_password
