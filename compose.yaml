# SupportPilot local environment.
#
# Network boundaries are the point of this file (SP-ARCH-001 §8). A service is attached only to the
# networks it must reach. PostgreSQL and OPA are on internal networks with no route to the edge, and
# check V-02 proves it.
#
#   docker compose up -d                   SupportPilot + Keycloak + OPA + PostgreSQL
#   docker compose --profile onyx up -d    adds Onyx (see ADR-0002)

name: supportpilot

x-postgres-image: &postgres-image postgres:16.4-alpine
x-python-base: &python-base
  restart: unless-stopped
  stop_grace_period: 10s

networks:
  # Reverse proxy and user-facing services only.
  edge:
    driver: bridge
  # Onyx -> API, approval portal -> API.
  app:
    driver: bridge
    internal: true
  # API -> OPA. Nothing else may reach the policy decision point.
  policy:
    driver: bridge
    internal: true
  # API and worker -> PostgreSQL.
  data:
    driver: bridge
    internal: true
  # Range -> the container proxy, and nothing else.
  control:
    driver: bridge
    internal: true
  # Range -> PostgreSQL, and nothing else.
  #
  # The Range cannot simply join `data`: the API is on `data` too, and sharing it would let the
  # Range reach the API. V-17 caught exactly that during the first run of this file, which is the
  # argument for writing the boundary check before the service has any authority to abuse.
  range_data:
    driver: bridge
    internal: true

volumes:
  postgres_data:

services:
  # --------------------------------------------------------------------------------------------
  # Data layer
  # --------------------------------------------------------------------------------------------
  postgres:
    image: *postgres-image
    container_name: supportpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-supportpilot}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-supportpilot_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      # Deterministic ordering for tests; avoids locale-dependent sort results.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    secrets:
      - postgres_bootstrap_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
      # The Range reaches PostgreSQL here rather than on `data`, so that joining the database does
      # not also join everything else attached to it.
      - range_data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-supportpilot_admin} -d ${DATABASE_NAME:-supportpilot}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot job. Owns the schema; runtime services never receive this credential.
  migrate:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: supportpilot/migrate:local
    container_name: supportpilot-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-supportpilot}
      BOOTSTRAP_USER: ${POSTGRES_BOOTSTRAP_USER:-supportpilot_admin}
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_db_password
      API_PASSWORD_FILE: /run/secrets/api_db_password
      WORKER_PASSWORD_FILE: /run/secrets/worker_db_password
      AUDITOR_PASSWORD_FILE: /run/secrets/auditor_db_password
      RANGE_PASSWORD_FILE: /run/secrets/range_db_password
      SEED_LOCAL_DATA: ${SEED_LOCAL_DATA:-true}
    secrets:
      - postgres_bootstrap_password
      - migrator_db_password
      - api_db_password
      - worker_db_password
      - auditor_db_password
      - range_db_password
    networks:
      - data

  # --------------------------------------------------------------------------------------------
  # Policy decision point. Private network only; no published port.
  # --------------------------------------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:1.4.2-static
    container_name: supportpilot-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--set=decision_logs.console=true"
      - "/policy"
    volumes:
      # Read-only bundle. OPA never writes policy.
      - ./policy/supportpilot:/policy:ro
    networks:
      - policy
    healthcheck:
      # The static image carries no shell or HTTP client, so the check evaluates the bundle
      # directly. Reachability of the OPA server is covered by the API's /readyz.
      test: ["CMD", "/opa", "eval", "--data", "/policy", "data.supportpilot.authz.health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # --------------------------------------------------------------------------------------------
  # Identity
  # --------------------------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: supportpilot-keycloak
    restart: unless-stopped
    # Keycloak 26 reads the bootstrap password only from KC_BOOTSTRAP_ADMIN_PASSWORD, with no
    # _FILE variant. The wrapper reads the mounted secret and exports it into Keycloak's own
    # process, so the value still never appears in compose, the image, or `docker inspect`.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm \
             --http-port=8080 --https-port=8443
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HOSTNAME_STRICT: "false"
      # One canonical issuer regardless of how Keycloak is reached. Without this, a token fetched
      # from the host carries iss=localhost:8080 while a token fetched from a container carries
      # iss=keycloak:8080, and the API can only ever accept one of them. The API validates against
      # this issuer but fetches keys over the internal network (KEYCLOAK_JWKS_URL), which is what
      # backchannel-dynamic allows.
      # HTTPS, because Onyx refuses a plain-HTTP identity provider and SP-ARCH-001 §8 asks
      # for internal HTTPS regardless. The certificate covers both names, so the browser reaching
      # localhost and containers reaching keycloak validate against the same file.
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/keycloak.key
      # `keycloak`, not `localhost`, and this is the subtle part.
      #
      # Onyx guards every endpoint the discovery document names, and ALLOW_PRIVATE_NETWORK still
      # blocks loopback — so a document advertising a localhost authorization_endpoint is refused
      # even though the discovery URL itself was accepted. Naming the service instead makes every
      # endpoint resolve to a private Docker address inside the container, which is allowed, and
      # keeps loopback blocked rather than switching the guard off.
      #
      # The browser needs `keycloak` to resolve too: add `127.0.0.1 keycloak` to the hosts file.
      # Keycloak stays bound to 127.0.0.1, so nothing is exposed to the LAN.
      KC_HOSTNAME: https://keycloak:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    secrets:
      - keycloak_admin_password
    volumes:
      # Identity configuration lives in this read-only file so it is reproducible and reviewable.
      #
      # Read the next sentence carefully, because an earlier version of this comment was wrong and
      # cost an hour: `docker compose restart keycloak` does NOT re-import. Keycloak logs
      # "Realm 'supportpilot' already exists. Import skipped" and keeps whatever is in its embedded
      # database, so an edit to this file has no effect at all.
      #
      #     docker compose up -d --force-recreate keycloak
      #
      # is what applies a change, because a new container gets a new embedded database and the
      # import runs with OVERWRITE_EXISTING. Changes made in the admin console survive a restart and
      # are lost on a recreate, which is the opposite of what the old comment claimed.
      - ./infrastructure/local/keycloak:/opt/keycloak/data/import:ro
      - ./.secrets/tls:/opt/keycloak/conf/tls:ro
    ports:
      # Local only. The user-facing login flow and the token endpoint the test harness calls.
      # 8080 stays published so the plain-HTTP harness keeps working; 8443 is what Onyx uses.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    networks:
      - edge
      - app
    healthcheck:
      # A TCP connect to the HTTPS listener, and nothing more.
      #
      # Enabling TLS moves Keycloak's management interface to HTTPS on 9000, and this image ships
      # with no curl, wget, python or openssl — so an in-container check of /health/ready is not
      # available. Rather than a check that looks precise and silently tests nothing, this asserts
      # exactly what it can: the TLS port is listening.
      #
      # Real readiness — the realm is imported and serving discovery — is asserted from the host by
      # scripts/bootstrap_local.py, which can use a TLS client.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --------------------------------------------------------------------------------------------
  # SupportPilot API. Reaches Keycloak (app), OPA (policy), PostgreSQL (data).
  # Not on the edge network: Onyx and the approval portal reach it over `app`.
  # --------------------------------------------------------------------------------------------
  api:
    <<: *python-base
    build:
      # Context is the repository root so the vendored wheel set is shared by every service.
      context: .
      dockerfile: services/api/Dockerfile
    image: supportpilot/api:local
    container_name: supportpilot-api
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SUPPORTPILOT_ENV: local
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://keycloak:8443/realms/supportpilot}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-https://keycloak:8443/realms/supportpilot/protocol/openid-connect/certs}
      SUPPORTPILOT_AUDIENCE: ${SUPPORTPILOT_AUDIENCE:-supportpilot-api}
      TOKEN_LEEWAY_SECONDS: ${TOKEN_LEEWAY_SECONDS:-30}
      OPA_URL: ${OPA_URL:-http://opa:8181/v1/data/supportpilot/authz/decision}
      OPA_TIMEOUT_MS: ${OPA_TIMEOUT_MS:-250}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-supportpilot}
      DATABASE_USER: sp_api_role
      API_DATABASE_SECRET_FILE: /run/secrets/api_db_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Public roots plus the local Keycloak certificate, for the JWKS fetch. Naming
      # keycloak.crt directly would replace the trust store rather than extend it, leaving the
      # API unable to verify anything else it might ever need to reach.
      SSL_CERT_FILE: /etc/ssl/supportpilot/ca-bundle.crt
    volumes:
      - ./.secrets/tls:/etc/ssl/supportpilot:ro
    secrets:
      - api_db_password
    # No published port, deliberately. The API is reachable only from the internal `app` network
    # (Onyx and the approval portal). Publishing a host port here would not even work — every
    # network the API is attached to is internal — and it would contradict SP-ARCH-001 §8, which
    # puts the API behind the reverse proxy rather than on the user network.
    #
    # verify-local.ps1 therefore calls the API from inside a container on `app`, which is also a
    # more faithful test: it exercises the path Onyx actually uses.
    networks:
      - app
      - policy
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # --------------------------------------------------------------------------------------------
  # Worker. Data network only: no inbound, and no route to OPA or the edge.
  # Phase 4 gives it real jobs; it holds a claim loop and health state now.
  # --------------------------------------------------------------------------------------------
  worker:
    <<: *python-base
    build:
      # Context is the repository root so the vendored wheel set is shared by every service.
      context: .
      dockerfile: services/worker/Dockerfile
    image: supportpilot/worker:local
    container_name: supportpilot-worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SUPPORTPILOT_ENV: local
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-supportpilot}
      DATABASE_USER: sp_worker_role
      WORKER_DATABASE_SECRET_FILE: /run/secrets/worker_db_password
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - worker_db_password
    networks:
      - data

  # --------------------------------------------------------------------------------------------
  # Approval portal. Edge for approvers, app to reach the API. No database access at all.
  # --------------------------------------------------------------------------------------------
  approval-portal:
    <<: *python-base
    build:
      # Context is the repository root so the vendored wheel set is shared by every service.
      context: .
      dockerfile: services/approval-portal/Dockerfile
    image: supportpilot/approval-portal:local
    container_name: supportpilot-approval
    depends_on:
      api:
        condition: service_started
    environment:
      SUPPORTPILOT_ENV: local
      SUPPORTPILOT_API_URL: http://api:8000
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://keycloak:8443/realms/supportpilot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - edge
      - app

  # --------------------------------------------------------------------------------------------
  # The Range — the practice surface.
  #
  # It arms the lab's controls into broken states so a learner can watch the consequence, which
  # makes it the largest piece of authority in this file. Read its boundaries here rather than
  # taking them on trust:
  #
  #   * `edge`, `range_data` and `control`. NOT on `app` or `policy`, and NOT on `data` — the API
  #     is on `data`, so sharing it would have handed the Range a route to the API. V-17 proves it.
  #   * Its database role owns nothing and holds no privilege on any table (migration 0010).
  #   * It is absent from openapi/supportpilot-actions.*, so the model has no route that names it.
  #   * SUPPORTPILOT_ENV must be `local` or the process exits before it binds a port.
  #
  # Profile-gated: a lab that is only being used as a lab does not need it running.
  # --------------------------------------------------------------------------------------------
  range:
    <<: *python-base
    profiles: ["range"]
    build:
      context: .
      dockerfile: services/range/Dockerfile
    image: supportpilot/range:local
    container_name: supportpilot-range
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SUPPORTPILOT_ENV: local
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-supportpilot}
      RANGE_DB_USER: sp_range_role
      RANGE_DB_PASSWORD_FILE: /run/secrets/range_db_password
      RANGE_CONTENT_DIR: /app/content
      DOCKER_PROXY_URL: http://docker-proxy:2375
      RANGE_REPO_DIR: /repo
      PROBE_URL: http://probe:8096
      PROBE_SHARED_SECRET_FILE: /run/secrets/probe_shared_secret
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - range_db_password
      - probe_shared_secret
    volumes:
      # Stage 03 shows the lab's own source with its real path and line numbers, read at request
      # time so the material cannot drift from the system. Four directories, read-only, named one by
      # one — mounting the repository root would have handed the Range .secrets/, which is the whole
      # reason this is a list rather than a single line.
      - ./database:/repo/database:ro
      - ./services:/repo/services:ro
      - ./policy:/repo/policy:ro
      - ./scripts:/repo/scripts:ro
      # The action document. Track 4 is about reading a tool schema and judging the authority it
      # grants, so the learner needs the real registered surface rather than a description of it.
      - ./openapi:/repo/openapi:ro
    ports:
      - "127.0.0.1:8095:8095"
    networks:
      - edge
      - range_data
      - control

  # --------------------------------------------------------------------------------------------
  # The probe service — a fixed vocabulary of API requests, for the Range.
  #
  # The Range cannot reach the API (V-17) and twelve challenges need a request made through it.
  # This service can reach the API, holds one hand-written list of requests, and answers to an id.
  # See docs/architecture/adr-0003-range-request-probes.md.
  #
  # It is on `app` because it must reach the API, which means anything else on `app` can open a
  # socket to it. Network placement alone cannot make the direction one-way, so the shared secret
  # does: it is mounted to this service and to the Range, and to nothing else.
  # --------------------------------------------------------------------------------------------
  probe:
    <<: *python-base
    profiles: ["range"]
    build:
      context: .
      dockerfile: services/probe/Dockerfile
    image: supportpilot/probe:local
    container_name: supportpilot-probe
    depends_on:
      api:
        condition: service_started
    environment:
      SUPPORTPILOT_ENV: local
      SUPPORTPILOT_API_URL: http://api:8000
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://keycloak:8443}
      KEYCLOAK_REALM: supportpilot
      PROBE_SHARED_SECRET_FILE: /run/secrets/probe_shared_secret
      SSL_CERT_FILE: /etc/ssl/supportpilot/ca-bundle.crt
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - probe_shared_secret
    volumes:
      - ./.secrets/tls:/etc/ssl/supportpilot:ro
    networks:
      - app
      - control

  # The only thing else on `control`. See infrastructure/local/docker-proxy/README.md for why the Range
  # does not get the Docker socket itself: a service holding that socket is root on the host, which
  # is not a smaller version of what the Range needs but an unbounded version of it.
  docker-proxy:
    profiles: ["range"]
    image: haproxy:2.9-alpine
    container_name: supportpilot-docker-proxy
    restart: unless-stopped
    read_only: true
    user: root
    volumes:
      - ./infrastructure/local/docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control

  # Onyx is NOT defined here.
  #
  # It ships as its own compose project (`name: onyx`) built from the upstream base file plus the
  # onyx-lite overlay, so vendoring a copy of it here would fork someone else's deployment. The
  # earlier profile in this file referenced an `onyx-lite` image that does not exist — Lite is an
  # overlay, not an image.
  #
  # `python scripts/connect_onyx.py` joins a running Onyx to the `app` network below and configures
  # the Keycloak client it needs. See docs/runbooks/onyx-integration.md.

# ------------------------------------------------------------------------------------------------
# Secrets are files outside the repository tree. Each service mounts only its own (SP-DATA-001 §10).
# ------------------------------------------------------------------------------------------------
secrets:
  postgres_bootstrap_password:
    file: ./.secrets/postgres_bootstrap_password
  migrator_db_password:
    file: ./.secrets/migrator_db_password
  api_db_password:
    file: ./.secrets/api_db_password
  worker_db_password:
    file: ./.secrets/worker_db_password
  auditor_db_password:
    file: ./.secrets/auditor_db_password
  range_db_password:
    file: ./.secrets/range_db_password
  probe_shared_secret:
    file: ./.secrets/probe_shared_secret
  keycloak_admin_password:
    file: ./.secrets/keycloak_admin_password
