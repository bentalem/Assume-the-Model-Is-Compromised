      additionalProperties: false
      type: object
      required:
      - order_number
      - status
      - currency
      - total_amount
      - placed_at
      - updated_at
      title: OrderResponse
      description: 'The bounded response schema.


        `extra="forbid"` means a field the repository adds later cannot reach the caller until someone

        adds it here deliberately — response minimization by construction rather than by review.'
    Shipment:
      properties:
        status:
          type: string
          title: Status
        carrier:
          anyOf:
          - type: string
          - type: 'null'
          title: Carrier
        tracking_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Tracking Ref
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
