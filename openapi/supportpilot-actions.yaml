openapi: 3.1.0
info:
  title: SupportPilot Actions
  description: Business operations the SupportPilot agent may request on behalf of an authenticated support
    user. Every operation authorizes the individual user; none accepts an identity supplied by the caller.
  version: 1.0.0
paths:
  /v1/orders/{order_number}:
    get:
      tags:
      - orders
      summary: Get an order visible to the authenticated user
      operationId: get_order
      parameters:
      - name: order_number
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 16
          pattern: ^ORD-[0-9]{4,12}$
          description: Order number in the form ORD-nnnn
          examples:
          - ORD-2001
          title: Order Number
        description: Order number in the form ORD-nnnn
      - name: include
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/OrderInclude'
          - type: 'null'
          description: 'Optional extra detail: items, shipment'
          title: Include
        description: 'Optional extra detail: items, shipment'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '404':
          description: Not found or not allowed
        '503':
          description: Service unavailable
  /v1/customers:
    get:
      tags:
      - customers
      summary: Find customers visible to the authenticated user
      operationId: search_customers
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          description: Part of a customer name to search for
          examples:
          - Priya
          title: Q
        description: Part of a customer name to search for
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 50
            minimum: 1
          - type: 'null'
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSearchResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '404':
          description: Not found or not allowed
        '503':
          description: Service unavailable
  /v1/customers/{customer_ref}:
    get:
      tags:
      - customers
      summary: Get one customer record the authenticated user may see
      operationId: get_customer
      parameters:
      - name: customer_ref
        in: path
