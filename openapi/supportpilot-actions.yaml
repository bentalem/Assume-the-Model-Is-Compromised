          title: Unit Amount
      additionalProperties: false
      type: object
      required:
      - sku
      - description
      - quantity
      - unit_amount
      title: OrderItem
    OrderResponse:
      properties:
        order_number:
          type: string
          title: Order Number
          description: The order identifier, e.g. ORD-2001
        status:
          type: string
          title: Status
          description: Order lifecycle status
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        total_amount:
          type: string
          title: Total Amount
          description: Decimal amount as a string, to avoid float rounding
        placed_at:
          type: string
          format: date-time
          title: Placed At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        items:
          anyOf:
          - items:
              $ref: '#/components/schemas/OrderItem'
            type: array
            maxItems: 50
          - type: 'null'
