[project]
name = "supportpilot-approval-portal"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.34.0", "httpx==0.28.1"]

[project.scripts]
supportpilot-approval-portal = "approval_portal.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
