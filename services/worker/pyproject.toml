[project]
name = "supportpilot-worker"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary,pool]==3.2.3", "httpx==0.28.1"]

[project.scripts]
supportpilot-worker = "supportpilot_worker.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
