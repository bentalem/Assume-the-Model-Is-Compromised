[project]
name = "supportpilot-probe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.34.0", "httpx==0.28.1"]

[project.scripts]
supportpilot-probe = "probe_service.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
