id = "4.1-the-worst-legal-call"
track = 4
number = "4.1"
title = "The worst legal call"
points = 40

summary = """
Seven tools, read as what they are: seven standing grants of authority to something steerable by \
the text it just read. One of them is not like the others."""

objective = """
Read the registered surface and find the single tool whose parameter shape grants the most \
authority. Name it, and say in one or two sentences what one legal call to it can do and why \
repetition matters."""

skip_test = """
the question you ask of every tool in a review, and why each clause of it is there."""

hints = [
  "Six of the seven take an identifier. What does the seventh take, and who chooses the set it returns?",
  "Look at the parameters column for that tool. Which of them decides how much comes back, and who supplies it?",
  "Is there anything in the surface that bounds a session rather than a single call?"
]

