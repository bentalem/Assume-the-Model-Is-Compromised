id = "4.2-shape-not-name"
track = 4
number = "4.2"
title = "The generic tool wearing a business name"
points = 40

summary = """
A tool is generic when the caller's argument chooses the operation rather than the operand, and the \
name on it tells you nothing about which it is. Audit the seven for the parameter that would do it."""

objective = """
Read the parameter shape of all seven registered operations and report whether any parameter is an \
object with no declared properties. Then name the check in this repository that would have caught \
one, and the check that would not."""

skip_test = """
what an object parameter with no schema turns a tool into, and which of your own schema checks \
would report one."""

purpose = """
You are practising a whole-surface audit rather than a spot check: count every parameter and every \
request-body property across the seven operations, and record for each whether it declares what it \
accepts. Part of the skill is telling a gap in your listing from a gap in the document — limit and \
cursor print without a type because they are declared as an anyOf, which is a fact about where the \
listing looked. The rest is reading the check that guards the document and working out which of \
its rules would reject an object with no properties and which would let one through."""

agent_link = """
The reading technique is ordinary interface review and needs no agent experience. What changes is \
the standing of the document: it is the whole of what constrains the caller, with no form, no \
client code and no person between the schema and the call, so a parameter typed object with no \
declared properties is not an under-documented interface but an undocumented API reachable through \
a reviewed one. Note where the gate here actually bites — it bounds parameter names and string \
parameter shapes, and a body property never enters that loop."""

hints = [
  "The surface prints a type beside each parameter, and two names print `?`. Is a type the listing could not find the same finding as a parameter that has no schema?",
  "Both POST operations carry a body typed `object`. What does each of those bodies declare that a generic parameter would not?",
  "`scripts/export_openapi.py` refuses to publish a document that breaks its rules. Is a property typed `object` with no properties one of the things it refuses?"
]

break_steps = [
  "Run **The same seven, by the prose beside them** first, and write down what you expect each tool's arguments to be.",
  "Run **Every registered operation, and the type of every parameter**. Count every parameter and every body field, and note each one's type.",
  "For each `?` in the type column, decide whether it is a gap in the listing or a gap in the document.",
  "Open Stage 03's `export_openapi.py` panels. List which rules look at a parameter's name and which at its shape, then decide whether an `object` property with no properties would be refused.",
  "Submit your audit: whether any parameter is an `object` with no schema, what `additionalProperties` does here, and what `export_openapi` would and would not catch.",
]

# Read-only. Nothing is armed: the finding this challenge teaches is an absence, and the only way to
# establish an absence is to read the whole surface.

[[observation]]
observation = "tools.surface"
label = "Every registered operation, and the type of every parameter"
detail = "Read from the published action document. The parameters column is the subject of this challenge."

[[observation]]
observation = "tools.descriptions"
label = "The same seven, by the prose beside them"
detail = "Read these first and write down what you expect each tool's arguments to be. Then read the shapes."

[[observation]]
observation = "content.registered_tools"
label = "The five modules those seven operations live in"
detail = "Where to go when the document tells you a shape and you want to see what reads it."

[flag]
kind = "written"
label = "the parameter audit, and the check that would not have caught one"
rubric = ["object", "additionalProperties", "export_openapi"]

