id = "6.1-approve-one-execute-another"
track = 6
number = "6.1"
title = "Approve one payload, execute another"
points = 35

summary = """
Get forty-five dollars approved, then change it to four thousand five hundred before the worker \
claims it. The approval is still valid. The refund is not."""

objective = """
Alter the pending payload without touching the hash, then give the reason code the worker records \
when it refuses to execute it. No observation can compute that answer from the database, and the \
third button says why: it reads the worker's refusal list out of the worker's own source. Seven \
entries, in the order the worker checks them. Choosing the right one is the challenge."""

skip_test = """
what an approval is actually binding to when somebody says "the refund was approved", and at which \
moment that binding is checked."""

purpose = """
Practise the difference between approving a record and approving content. Edit the pending \
payload, leave the hash alone, and find where that is caught — a hash recomputed from the payload \
the worker is about to send, in the last component before the provider call. Work out why there \
are two reason codes and which failure each describes, because a system carrying only the second \
one would have paid your altered amount."""

agent_link = """
Classical: time-of-check to time-of-use, and binding an authorisation to a hash of its content is \
a payments control decades older than this course. What an agent changes is who proposes. \
Payloads are produced automatically and in volume, and the approver's screen is the only place a \
human reads one — so the approval has to bind to exact content, and the binding has to be \
recomputed at the moment of the irreversible act rather than at the moment of the request."""

hints = [
  "The approval recorded a hash. When is that hash next compared to anything, and by which component?",
  "The observation can tell you the payload changed. Can it tell you the hash no longer matches? Why not?",
  "Two of the seven entries in the refusal list are about the hash. Which of those two fires first, and what is the other one for?",
]

[[control]]
mutation = "action.payload.tamper"
label = "Change the approved amount from 45.00 to 4500.00"
detail = "Updates the payload only. payload_hash is left exactly as it was."

[[observation]]
observation = "actions.payload_binding"
label = "What the pending approval is bound to"
detail = "The amount, the hash the approval binds to, and whether the amount is still the proposed one."

[[observation]]
observation = "actions.pending"
label = "Action requests and their state"
detail = "Nothing changes state here. The request is still PENDING_APPROVAL either way."

[[observation]]
observation = "worker.refusals"
label = "Every reason the worker can refuse, in the order it checks them"
detail = "Read from the worker's source, not computed. It does not know what you armed — it knows what the worker looks at."

[flag]
kind = "reason"
label = "the reason code the worker records"
reason_code = "payload_hash_mismatch_stored"

[[source]]
path = "services/worker/src/supportpilot_worker/jobs/processor.py"
lines = [222, 237]
highlight = [229, 235]
caption = "The integrity check, immediately before the provider is called"

[[source]]
path = "database/migrations/0008_actions.sql"
lines = [45, 60]
highlight = [51, 53]
caption = "Why the approval stores the hash again rather than pointing at it"
