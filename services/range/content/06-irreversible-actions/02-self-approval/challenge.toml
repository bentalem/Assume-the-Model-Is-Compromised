id = "6.2-self-approval"
track = 6
number = "6.2"
title = "Self-approval, three times over"
points = 30

summary = """
The person who asked for the refund tries to approve it. Three independent things refuse — and the \
interesting question is why anyone would build the third."""

objective = """
Attempt the self-approval and find out what refuses it. Then run the control group, and give the \
component that actually stopped it — not the layer you would have guessed."""

skip_test = """
why a control enforced in three places is not redundant, and which of the three would still hold if \
someone deleted the other two this afternoon."""

purpose = """
Practise proving which layer actually enforced something. Attempt the self-approval straight at \
the table, then run the same insert with a different approver, and only then name what refused it \
— here a database trigger, because the attempt never reached the policy engine or the portal. The \
second attempt is the part worth keeping: without it, a refusal could equally mean the table \
takes no approvals at all."""

agent_link = """
Classical, and the oldest control in the course: separation of duty predates computers by \
centuries and is unchanged by anything a model does. What an agent changes is that proposing and \
justifying collapse into one component, and that component can be steered by text it read, so the \
second party has to be somebody the text cannot reach. Notice the property that makes it worth \
the cost — the rule does not care how convincing the request was, which is the right answer to an \
attacker whose whole technique is being convincing."""

hints = [
  "Before you decide what refused it, run the same approval with a different approver. What does that tell you about the refusal?",
  "The error text is quoted from the thing that raised it. What kind of component raises an exception with a message like that?",
  "If the policy engine were bypassed and the portal were replaced by a script, which of the three would still be in the way?",
]

# No controls. Attempting the write is the exercise, and both attempts undo themselves.

[[observation]]
observation = "actions.pending"
label = "Action requests and their state"
detail = "What is waiting for approval, with the payload hash each approval would bind to."

[[observation]]
observation = "approval.self_attempt"
label = "Approve the request as the person who raised it"
detail = "A direct insert, bypassing the API and the portal entirely. Rolls back either way."

[[observation]]
observation = "approval.independent_attempt"
label = "The same approval by a different person"
detail = "The control group. Without it you cannot tell a rule about people from a broken table."

[flag]
kind = "value"
label = "what refused the self-approval"
observation = "approval.self_attempt"
field = "refused_by"

[[source]]
path = "database/migrations/0008_actions.sql"
lines = [62, 86]
highlight = [80, 83]
caption = "The third refusal, and the comment explaining why a CHECK constraint could not do it"

[[source]]
path = "policy/supportpilot/authz.rego"
lines = [319, 342]
highlight = [325, 328]
caption = "The first refusal — the same rule, expressed where business rules live"
