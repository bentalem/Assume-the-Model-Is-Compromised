id = "6.3-exactly-once"
track = 6
number = "6.3"
title = "Exactly once"
points = 30

summary = """
The provider timed out. Nobody knows whether the money moved. The worker is about to try again — \
and something has to make sure that is safe."""

objective = """
Record the same effect twice under the same idempotency key, and give the name of the constraint \
that refuses it. Run the control group too: without it you have not proved anything about keys."""

skip_test = """
what a worker should do when a payment call times out, and which of the three "once" constraints in \
this schema is the only one that helps."""

purpose = """
Practise deciding what to do with no information: a provider call timed out and nothing tells you \
whether the money moved. Record the same effect twice under one key, name the constraint that \
refuses it, and run the fresh-key attempt so that you have shown the refusal is about the key \
rather than about the row, the grant or the role. Keep retry and reconciliation apart — \
idempotency makes a second attempt harmless, it does not tell you what the first one did."""

agent_link = """
Nothing in this challenge is agent-specific. Idempotency keys and a unique index are payments \
engineering, and the exercise would read the same in a system with no model anywhere in it. What \
an agent changes is rate and the absence of a reader: attempts arrive automatically and nobody \
looks at each one, so once has to be held by the database rather than by a component that checks \
before it acts — which is a race with itself the moment there are two workers."""

hints = [
  "Before you attempt anything: what are the three possible states of a payment call that timed out?",
  "Two of the three unique constraints in this schema stop a duplicate being created. Which one stops a duplicate being recorded?",
  "The control group inserts a row too. If it were also refused, what would that tell you about the first result?",
]

[[observation]]
observation = "execution.evidence"
label = "What has actually executed"
detail = "One row per effect, each under its own idempotency key."

[[observation]]
observation = "execution.replay_attempt"
label = "Record the same effect again, under the same key"
detail = "Exactly what a retry after a timeout would do. Rolls back either way."

[[observation]]
observation = "execution.new_key_attempt"
label = "The same insert under a fresh key"
detail = "The control group. Proves the refusal is about the key and not about the row."

[flag]
kind = "value"
label = "the constraint that refuses the replay"
observation = "execution.replay_attempt"
field = "refused_by"

