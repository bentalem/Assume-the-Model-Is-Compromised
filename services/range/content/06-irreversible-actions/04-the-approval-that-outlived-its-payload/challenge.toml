id = "6.4-approval-that-outlived-it"
track = 6
number = "6.4"
title = "The approval that outlived its payload"
points = 25

summary = """
An approval that never expires is not an approval. It is a capability, sitting in a table, waiting \
for someone to find it."""

objective = """
Move the approval window into the past and give the reason code the worker records when it refuses \
to execute a request whose window has closed. The third button lists the worker's refusals in the \
order it checks them, read from its source; the window is one of the seven things it looks at, and \
finding which one is yours is the exercise."""

skip_test = """
why an approval needs a deadline at all when the thing it approves has not changed, and which clock \
that deadline is measured against."""

purpose = """
Practise reasoning about the one input that changes with nobody acting: time. Move the window \
into the past, find the reason code, then establish where the deadline is evaluated and against \
whose clock — a comparison inside the worker, immediately before the provider call, against that \
process's own clock. Note what was not wrong: payload, hash, approver and state were all fine, \
which is why this is the control that gets left out."""

agent_link = """
Classical: a time-bounded authorisation is standard in banking and payments, and the ordinary \
reasons an approved action is still queued — an outage, a backlog, a lease that was lost — have \
nothing to do with models. What an agent changes is how many approved and unexecuted actions \
exist at one time, and that nothing re-reads the situation between the approval and the effect. \
The approver's judgement was a statement about a moment, so the deadline belongs at the moment of \
the act."""

hints = [
  "The request is unchanged. The approver is unchanged. The payload hash still matches. What is different?",
  "Which component compares the deadline to a clock, and whose clock is it?",
  "Why would a queued action still be sitting there hours later — and what are the ordinary reasons, before the malicious one?",
]

[[control]]
mutation = "action.approval.expire"
label = "Move the approval window two hours into the past"
detail = "The request stays pending and nothing else about it changes."

[[observation]]
observation = "actions.approval_window"
label = "The approval window against the server's clock"
detail = "When it closes, what time the database thinks it is, and how long is left."

[[observation]]
observation = "actions.payload_binding"
label = "What the approval is bound to"
detail = "Unchanged by this challenge — useful for seeing that nothing else is wrong."

[[observation]]
observation = "worker.refusals"
label = "Every reason the worker can refuse, in the order it checks them"
detail = "Read from the worker's source. Six of the seven are about things this challenge left alone."

[flag]
kind = "reason"
label = "the reason code the worker records"
reason_code = "approval_expired"

[[source]]
path = "services/worker/src/supportpilot_worker/jobs/processor.py"
lines = [218, 237]
highlight = [226, 227]
caption = "The expiry check, in the same block as separation of duty and payload integrity"

[[source]]
path = "database/migrations/0008_actions.sql"
lines = [180, 195]
highlight = [186, 190]
caption = "The window is also in the query that decides what an approver may act on"
