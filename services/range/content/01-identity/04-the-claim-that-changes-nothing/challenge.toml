id = "1.4-the-claim-that-changes-nothing"
track = 1
number = "1.4"
title = "The claim that changes nothing"
points = 25

summary = """
Take a real token, rewrite the tenant inside it, sign it with your own key, and send it. Then think \
about which of the two things wrong with that the API actually noticed."""

objective = """
Run all three tampered tokens against the API alongside a genuine one, and give the error code the \
API returns for every tampered case."""

skip_test = """
which checks a token verifier has to perform beyond "is the signature valid", and why a claim in a \
token is not a fact about a person."""

purpose = """
You send three tokens that are each wrong in one way — unsigned, re-signed with an attacker's
key, and re-signed with the tenant claim rewritten — and account for why all three are refused at the
same point. The skill is ordering a verifier's checks well enough to see that the rewritten claim
was never read at all, because nothing downstream of verification runs on a token that did not
verify. The second half is the more durable one: knowing which inputs to an authorization decision
are claims and which are lookups, so you can say what an attacker holding the signing key would
actually gain."""

agent_link = """
JWT verification is classical application security and none of it is new. What carries over to
agents is the claim-versus-lookup habit underneath it. A tool call is a bag of arguments assembled
upstream of every check, and the caller assembling them can be influenced by the text it just read,
so "the caller asserted this value" versus "the server read this value from its own records" is the
distinction that decides whether a request can be moved into another tenant. A rewritten tenant
claim and a tool argument named organization_id are the same mistake at two layers."""

hints = [
  "Have you run the untampered request first — and if you have not seen it succeed, what does a refusal tell you?",
  "All three tampered cases return the same code. At which point in the verifier were all three already dead?",
  "Suppose the signature had been perfect. What would the rewritten organization_id have changed?",
]

break_steps = [
  "Run **A genuine token, unmodified** first. You need to see the request succeed before a refusal means anything.",
  "Run **The same claims, with alg=none and no signature**. Note the status and the error code.",
  "Run **The same claims, re-signed with an attacker's key**, then **organization_id rewritten, then re-signed**.",
  "All three tampered tokens get the same answer. Using the order of checks in 1.1's Part 1 tab, find the one step where all three were already refused.",
  "Submit the error code the API returns for every tampered token. Nothing was armed: the tokens were built wrong on the way out, and the lab is untouched.",
]

# Read-only. Nothing is armed: the tokens are built wrong on the way out, and the lab is untouched.

[[observation]]
observation = "api.alice.own_order"
label = "A genuine token, unmodified"
detail = "The control group. Everything below differs from this in exactly one respect."

[[observation]]
observation = "token.unsigned"
label = "The same claims, with alg=none and no signature"
detail = "The oldest JWT attack. Still worth checking for."

[[observation]]
observation = "token.resigned"
label = "The same claims, re-signed with an attacker's key"
detail = "Algorithm confusion: HS256, using a key the attacker chose."

[[observation]]
observation = "token.claimed_org"
label = "organization_id rewritten, then re-signed"
detail = "Two things wrong at once. Only one of them mattered."

[flag]
kind = "value"
label = "the error code returned for every tampered token"
observation = "token.unsigned"
field = "error_code"

