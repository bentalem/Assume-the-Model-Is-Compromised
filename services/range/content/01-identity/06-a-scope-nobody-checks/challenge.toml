highlight = [72, 74]
anchor = "allow_with(_, _) := deny(delegation_denial) if not delegation_permits"
caption = "Why one line is enough: every allow in the policy passes through allow_with"

[[source]]
path = "services/api/src/supportpilot_api/pipeline.py"
