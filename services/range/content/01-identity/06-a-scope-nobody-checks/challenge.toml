path = "policy/supportpilot/authz.rego"
lines = [83, 120]
highlight = [95, 109]
anchor = "scope_granted if required_scope in input.delegation.scopes"
caption = "The scope check, in the policy. The armed variant removes one line: scope_granted"

[[source]]
path = "policy/supportpilot/authz.rego"
