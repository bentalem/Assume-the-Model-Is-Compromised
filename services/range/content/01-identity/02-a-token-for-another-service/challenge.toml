id = "1.2-a-token-for-another-service"
track = 1
number = "1.2"
title = "A token for another service"
points = 30

summary = """
Right issuer. Right signature. Right user. Not expired. Nothing forged anywhere — and the API \
refuses it, for a reason most APIs never check."""

objective = """
Present a genuine token minted for a different service in the same realm, and name the claim that \
caused the refusal. Read the intent column: the value is in front of you."""

skip_test = """
what stops a valid token issued for one service from working on another, and what happens across an \
organisation when that check is missing."""

purpose = """
You send three credentials at one API — a genuine token, a genuine token minted for a different
client in the same realm, and a forgery — and work out which single claim separated the first from
the second. The skill is treating token validation as a list of checks rather than one, and
recognising the case where everything about a credential is correct except who it was issued to.
It also leaves you with a test you can run against somebody else's service using only a token you
already hold."""

agent_link = """
Audience validation is classical identity engineering: it mattered before anything was calling a
tool on a model's suggestion, and the check is the one OAuth deployments have needed for years.
What an agent changes is how many doors a token gets carried to. An agent that receives a user's
token and calls several services on their behalf is exactly the component that can present a
credential where it was never meant to go, at machine rate and with nobody reviewing each call."""

hints = [
  "Which of the checks a verifier performs could this token possibly fail, given that nothing about it is forged?",
  "The intent column prints one claim from the token. What is it, and what is missing from it?",
  "If forty services trust one identity provider and none of them check this, how many of them can a token from any one of them reach?"
]

break_steps = [
  "Run **A token minted for this API** first. It is the control group: the same user and request, succeeding.",
  "Run **A token minted for another service in the same realm**. Read the `intent` column — it prints the one claim that differs.",
  "Run **For contrast: a token that really is forged**. Compare its status and error code with the previous row.",
  "Both refused tokens got the same answer. Decide which check stopped each one, using the order of checks from 1.1's Part 1 tab.",
  "Submit the name of the claim that caused the genuine token to be refused. Nothing was armed, so there is nothing to reset.",
]

# Read-only. The token is genuine; only its intended recipient is wrong.

[[observation]]
observation = "api.alice.own_order"
label = "A token minted for this API"
detail = "The control group. Same user, same request, same everything except one claim."

[[observation]]
observation = "token.other_service"
label = "A token minted for another service in the same realm"
detail = "Nothing forged. Read the aud value printed in the intent column."

[[observation]]
observation = "token.resigned"
label = "For contrast: a token that really is forged"
detail = "Same refusal, entirely different reason. Two failures can look identical from outside."

[flag]
kind = "written"
label = "the claim that caused the refusal"
rubric = ["aud"]

[[source]]
path = "infrastructure/local/keycloak/supportpilot-realm.json"
lines = [191, 209]
highlight = [192, 200]
anchor = '"protocolMappers": [],'
caption = "The realm declares five clients and three of them mint tokens, but only two attach this API's audience. This one attaches nothing"

[[source]]
path = "services/api/src/supportpilot_api/auth/tokens.py"
lines = [191, 217]
highlight = [197, 202]
anchor = '"require_aud": True,'
caption = "The audience check: the value must name this API, and since the lab's own finding it must also be present"
