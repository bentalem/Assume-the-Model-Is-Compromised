id = "8.1-the-third-copy"
track = 8
number = "8.1"
title = "The third copy"
points = 40

summary = """
The tool list exists in three places. Two of them are checked against each other whenever somebody \
runs the check. The third is a human pasting a file into a web form."""

objective = """
Find every place this system stores what tools the agent has. For each one, say what keeps it in \
step with the others, and name the copy that nothing checks. Then say what a reader of the passing \
check is entitled to conclude, and what they are not."""

skip_test = """
why a generated document and a registered tool list are different artifacts, and which of the two \
your agent is actually holding."""

purpose = """
You count the copies of one control artifact and, for each, name the mechanism that keeps it in \
step with the others. Two of the three here are compared by a check that runs when somebody runs it; \
the third is made by a person pasting a document into an admin panel, and nothing in this repository can even read it. \
The skill is reading a green check for its exact scope — what `OK: action document matches the \
code` entitles you to conclude, and what people assume it covers instead."""

agent_link = """
The general shape is classical: configuration living in a system your pipeline cannot reach, the \
same category as a DNS record, a console-made IAM role or a webhook URL. What is agent-specific is \
what this particular copy decides — the set of operations an automated caller may attempt against \
production — and that the drift is not symmetric. A removed tool or a narrowed schema fails closed \
at the boundary, because authority is enforced there and not from the document. A stale \
description fails silently: nothing validates prose, so nothing refuses."""

hints = [
  "The check prints 'action document matches the code'. Which two of the three copies is that comparing?",
  "How does the tool list get from the document into the agent — what runs, and who runs it?",
  "If a tool were removed from the code today and every check passed, what would the agent still believe it could call?",
]

break_steps = [
  "Run **Copy one: the modules the code actually registers** and **Copy two: the exported document**. Satisfy yourself the two agree.",
  "Read the first source panel: which two artifacts does the check compare, and does it deploy anything?",
  "Read the second source panel and find how the tool list reaches the agent. Who does it, and how often?",
  "Look for an observation of copy three. There is none — work out why the Range cannot read it.",
  "Run **The prose that travels with copy two** and decide which kind of drift in copy three would fail closed, and which would fail silently.",
  "Submit the third copy, and what the passing check does not cover. Nothing was armed, so there is nothing to reset.",
]

# Read-only. Nothing is armed, and the reason is the finding: the copy this challenge is about lives
# in a service the Range cannot see, which is precisely why nothing checks it.

