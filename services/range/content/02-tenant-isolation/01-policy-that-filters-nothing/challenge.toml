id = "2.1-policy-that-filters-nothing"
track = 2
number = "2.1"
title = "The policy that filters nothing"
points = 30

summary = """
A tenant policy that is correctly written, visible in every schema dump, attached to the right role \
— and returning every tenant's rows."""

objective = """
Make app.orders return a row belonging to northwind while a cedar request is in context, and read \
that order's total. You may not write SQL and you may not change the policy: the policy is already \
correct, and that is the point."""

# The renderer supplies the "skip this only if you can already answer" framing, so this is the
# question and nothing else.
skip_test = """
which *three* things all have to be true before a PostgreSQL row policy filters a query, and which \
one of them a code review cannot see."""

purpose = """You take a row policy that is correct, leave it exactly as written, and make it stop filtering by
changing something that is not in the policy at all. The skill is holding the whole precondition
set rather than the policy alone: row security enabled, FORCE set, and a connecting role that
neither owns the table nor holds BYPASSRLS or SUPERUSER. Three of those four inputs live in the
catalogue and the connection string rather than in anything a data-layer review reads, which is why
the exercise ends in two queries you can ask a DBA for rather than in a code reading."""

agent_link = """Row-level security is ordinary multi-tenancy engineering. A system with no model anywhere near it
needs this just as much, and if you find the gap in a client's system the honest label on the
finding is tenant isolation, not AI risk. What an agent changes is the value of the layer rather
than the layer itself: the set of queries is composed at run time instead of being a finite list
somebody reviewed, and the component choosing which record to ask for is influenced by content an
attacker may have written. Enforcement that depends on every call site remembering a filter is
worth less once nobody can enumerate the call sites."""

hints = [
  "Which database role is in the application's connection string, and who owns the table it is reading?",
  "PostgreSQL has two separate flags for row security, not one. What is the second one for?",
  "You have two switches. Four combinations. Which of the four does a schema dump look identical in?",
]

# ------------------------------------------------------------------------------------------------
# Stage 02 — the console.
#
# Both controls are registry ids. The browser posts the id; it never names a table, a role or a
# statement. Two switches rather than one because the lesson is the truth table, and a learner who
# only ever sees FORCE toggled has been shown a fact rather than taught a mechanism.
# ------------------------------------------------------------------------------------------------
[[control]]
mutation = "rls.orders.force_off"
label = "Drop FORCE from app.orders"
detail = "Leaves row security enabled. The policy stays exactly as written."

[[control]]
mutation = "rls.orders.disable"
label = "Disable row security on app.orders"
detail = "Turns the feature off entirely. The policy still exists and is still correct."

[[observation]]
observation = "orders.as_owner"
label = "Read app.orders as the role that owns it"
detail = "A cedar tenant context is set first, exactly as the API sets it on every request."

[[observation]]
observation = "orders.catalogue"
label = "Show owner, enabled and forced for every table"
detail = "The four-question query, run against the live catalogue rather than described."

[[observation]]
observation = "roles.attributes"
label = "Show superuser and BYPASSRLS for every lab role"
detail = "The other half of the same audit: two more ways to be exempt from a policy."

# ------------------------------------------------------------------------------------------------
# The flag is northwind's order total. It lives in the seed data and the Range asks the database for
# it rather than carrying a literal, so it cannot drift. It is unobtainable while both mutations
# probe `correct`: a cedar context under FORCE returns no northwind row at all.
# ------------------------------------------------------------------------------------------------
[flag]
kind = "value"
label = "northwind's order total"
observation = "orders.as_owner"
field = "total_amount"

