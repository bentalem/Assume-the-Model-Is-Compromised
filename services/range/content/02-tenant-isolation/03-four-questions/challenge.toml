id = "2.3-four-questions"
track = 2
number = "2.3"
title = "Four questions"
points = 25

summary = """
Sixteen tables. Fifteen are correct. Find the one that is not, using only the query you would ask \
a client's DBA for."""

objective = """
One table in the app schema has lost FORCE. Nothing tells you which, and you may not read the \
migrations. Find it with the catalogue, and give its name."""

skip_test = """
which catalogue columns answer "is this table actually filtering", and why the answer needs a \
second query about roles."""

purpose = """You audit a schema you did not write, using only the two queries a DBA can run while you wait, and
find the one table where the enabled and forced columns disagree. The skill is auditing the list
rather than the story: ask for every table in the schema instead of the ones the team considers
sensitive, and pair the catalogue with the role attributes, because a clean catalogue proves
nothing if the connecting role holds BYPASSRLS. The write-up matters as much as the find — name the
data the table holds, not the flag that is missing."""

agent_link = """Nothing in the technique is agent-specific; this is a configuration audit that would have been
worth running on a web application from fifteen years ago, and the finding is a tenant isolation
finding. The agent angle is about which tables end up in reach. A human workflow touches the tables
its screens were built for, while tool calls composed at run time follow the joins — an order read
in this lab returns line items, so the table nobody thought of as tenant data is served by a tool
that never names it."""

hints = [
  "You are looking for a disagreement between two columns, not for a missing row. Which two?",
  "Fourteen of the sixteen rows look identical once you have armed it. What is the fastest way to make the odd one obvious?",
  "Once you have the table — would this one have been caught by a review of the tenant logic? Why not?",
]

[[control]]
mutation = "rls.order_items.force_off"
label = "Break one table in the schema"
detail = "Drops FORCE from a single table. You are not told which."

[[observation]]
observation = "orders.catalogue"
label = "Owner, enabled and forced for every table"
detail = "The whole schema, sixteen rows. This is the query you would actually ask for."

[[observation]]
observation = "catalogue.unforced"
label = "Only the tables that are not fully protected"
detail = "The same query with the finding filtered out of it. Empty is the correct answer."

[[observation]]
observation = "roles.attributes"
label = "Superuser and BYPASSRLS for every lab role"
detail = "The second half of the audit. A clean catalogue still proves nothing without this."

[flag]
kind = "value"
label = "the table that is enabled but not forced"
observation = "catalogue.unforced"
field = "table_name"

[[source]]
path = "database/migrations/0003_customers_orders.sql"
lines = [42, 46]
highlight = [44, 45]
caption = "How the correct tables were configured — two lines, easy to copy and easy to half-copy"

[[source]]
path = "database/tests/permissions_smoke.sql"
lines = [1, 22]
highlight = [14, 22]
caption = "The lab checks its own roles on every migration; this is what that looks like"
