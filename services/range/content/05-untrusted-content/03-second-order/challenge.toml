id = "5.3-second-order"
track = 5
number = "5.3"
title = "Second order"
points = 35

summary = """
One of the eleven messages on TKT-1001 was written by an agent, marked internal, and carries an \
instruction. It arrives in the next reader's context with a label that says it is staff material."""

objective = """
Count the messages on TKT-1001 by author, find the one the system wrote about itself, and then \
trace the loop: which write path could have produced it, and which read path returns it. Answer in \
a sentence or two: what changed about the text on the way through, and what did not."""

skip_test = """
why a system's own summary is a delivery channel, and which field has to survive the trip for a \
later reader to tell."""

purpose = """
Practise tracing a loop through the system's own storage. Count the corpus by author before you \
read any bodies, find the row the system wrote about itself, then follow both halves: which \
registered operation could write a row like it, and which one reads that table back. Establishing \
that the read half does not exist here — rather than accepting the narration — is the skill. Then \
find the provenance column the query loads and the response model drops."""

agent_link = """
The shape is an old one: data laundered into a store the organization owns and read back as a \
record, the same idea as second-order SQL injection. What an agent adds is that the system writes \
to itself with nobody reading the summary in between, and that provenance thins on the way — a \
later reader is told an agent wrote the text, which is true, and is not told that a customer \
supplied the words. That is an attribution problem as much as an injection one, and it is what an \
incident reconstructed a month later runs into."""

hints = [
  "Group content.injection_corpus by its author column. How many distinct values are there, and which one appears once?",
  "The row query selects five columns and the response model declares three. Which one is loaded and then dropped?",
  "add_internal_note writes to a table. Does any registered operation read that table back?",
]

# Nothing to arm. The agent-authored message is seed data and the lab is in its correct state — the
# challenge is to notice that a correct system still carries this shape.

[[observation]]
observation = "content.injection_corpus"
label = "Every message on TKT-1001, with its author and visibility"
detail = "Count by author before reading the bodies. One of the three values appears exactly once."

[[observation]]
observation = "api.alice.ticket_1001"
label = "Alice reads the ticket through the API"
detail = "A support agent, a permitted request, an ordinary 200. The internal note is not what makes this unusual."

[[observation]]
observation = "content.registered_tools"
label = "The tool modules, including the one that writes"
detail = "notes.py is the write half of the loop. Check what the read half returns."

[flag]
kind = "written"
label = "what changed about the text on the way through, and what did not"
rubric = ["author", "trust", "authority"]

