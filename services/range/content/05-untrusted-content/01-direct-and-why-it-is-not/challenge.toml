id = "5.1-direct-and-why-it-is-not"
track = 5
number = "5.1"
title = "Direct, and why it is not a finding"
points = 25

summary = """
The instruction override and the administrator claim, run where the attacker is the user. Nothing \
crosses a boundary, so the only question left is how much the caller could already do."""

objective = """
Establish the ceiling. Read alice's memberships and the registered operation list, then say what \
the worst outcome of a successful direct injection in her session actually is — and why that number \
is the finding rather than the text that produced it."""

skip_test = """
why a direct injection is bounded by the caller's own authority, and which single change to a \
deployment makes that stop being true."""

purpose = """
Practise establishing a ceiling before arguing about text. Read alice's memberships from the \
server, read the registered operation list in full, and write down the worst legal call the two \
together allow. Then find the single assumption that argument rests on — that the agent calls \
tools with the caller's own token — so that you know which question to ask first on a system that \
is not this one."""

agent_link = """
Direct injection does not cross a boundary: the author of the text and the credential it runs \
under are the same person, so succeeding gains them nothing they did not hold. It is in an agent \
course as the calibration exercise — severity comes from reachable authority, not from wording. \
One deployment change breaks that argument, the agent holding a service account instead of the \
caller's token, and then a single credential holds more than any one caller does and the same \
sentence becomes an escalation."""

hints = [
  "If alice typed the override herself, which row in identity.memberships would have to change for it to gain her anything?",
  "The policy input has four fields about the subject. Which of them could a sentence in a chat window reach?",
  "Whose token does the agent hold? What happens to the ceiling if the answer is a service account instead?",
]

# Nothing to arm. The point of this challenge is that the environment in its correct state already
# answers the question — the ceiling is a property of the deployment, not of a broken control.

[[observation]]
observation = "identity.memberships"
label = "Alice's authority, as the server records it"
detail = "One active role. This is the ceiling a direct injection in her session inherits."

[[observation]]
observation = "tools.surface"
label = "Every operation the agent can call"
detail = "Read the whole list. A direct injection buys the attacker this set and nothing beyond it."

[[observation]]
observation = "content.injection_corpus"
label = "The two messages this challenge borrows"
detail = "The instruction override and the administrator claim. Here they are customer text; the exercise is to imagine them typed by the caller instead."

[[observation]]
observation = "api.alice.own_order"
label = "Alice making a permitted request herself"
detail = "The comparison that matters. Whatever the injection asks for, this is the authority it would be asking with."

[flag]
kind = "written"
label = "why direct injection is the lowest-severity of the three kinds"
rubric = ["already", "authority", "role"]

