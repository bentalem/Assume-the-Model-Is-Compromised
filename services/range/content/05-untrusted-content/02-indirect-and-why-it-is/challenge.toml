id = "5.2-indirect-and-why-it-is"
track = 5
number = "5.2"
title = "Indirect, and why it is a finding"
points = 35

summary = """
Nine instructions — eight written by a customer, one by an agent — arriving through a request nobody \
could object to. None of them achieved anything, and not one of them was blocked."""

objective = """
Read the corpus and trace each attempt to the thing that made it inert. Then answer in a sentence \
or two: why did none of them work, given that nothing filtered any of them?"""

skip_test = """
the difference between an injection that was stopped and an injection that had nowhere to go, and \
which of the two this lab demonstrates."""

purpose = """
Practise the move the rest of this track is built on: assume the text arrived intact and was \
acted on, then ask what it could reach. Take the seeded attempts one at a time and name the \
structural reason each had nowhere to go — a tool that is not registered, a role that is loaded \
from a table, a secret that was never in the context, an approval that is a row with a hash. Keep \
apart the two outcomes that look identical from outside: an attempt that was stopped, and an \
attempt that had no target."""

agent_link = """
This is the most agent-specific subject in the course, because it exists only where one channel \
carries instructions and data with no separator; there is no prepared statement for English. That \
is why the exercise is about tools, credentials and boundaries rather than about filtering the \
text. Note the attempt with no structural answer — permitted reads, repeated — because permission \
is evaluated per call while damage accumulates across calls, and nothing in this lab counts \
calls."""

hints = [
  "Attempt 6 names two tools. Are they in the list of tool modules beside it?",
  "Attempt 3 declares the sender an administrator. Which input to which check would that have had to change?",
  "Attempt 7 forges a tool result claiming an approval. What does the worker compare an approval against?",
]

# Nothing to arm. The corpus is seed data and the lab is in its normal state — which is the point:
# no filter is running, and none of these worked anyway.

[[observation]]
observation = "content.injection_corpus"
label = "The messages on TKT-1001"
detail = "Eleven rows: one genuine complaint, nine instruction-shaped (one written by an agent), one restricted internal note. Bodies are truncated in this panel."

[[observation]]
observation = "content.registered_tools"
label = "The tool modules the model can call"
detail = "Check the claims in the corpus against this rather than taking the lab's word for it."

[[observation]]
observation = "api.alice.ticket_1001"
label = "Read the ticket through the API as alice"
detail = "A permitted request. This is how the untrusted text reaches the model in the first place."

[[observation]]
observation = "identity.memberships"
label = "Where roles actually come from"
detail = "Relevant to attempt 3, which declares its author an administrator."

[flag]
kind = "written"
label = "why none of them worked"
rubric = ["exist", "role", "secret"]

