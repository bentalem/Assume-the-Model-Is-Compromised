id = "7.4-the-test-that-lied"
track = 7
number = "7.4"
title = "The test that lied in its own name"
points = 35

summary = """
A passing suite. Every case green. One of them claims something far larger than it checks, and it \
is the case that matters most."""

objective = """
Read the abuse suite below. Find the case whose name asserts more than its assertions can support, \
name it, and say what it actually proves. There is nothing to arm: the suite passes, and that is \
the problem. The console has one button, and it does the thing that case's name rules out — against \
the same system the suite is green against."""

skip_test = """
what a passing test proves about the control it covers, and what it proves about the claim in its \
name."""

purpose = """
You read a passing suite the way a reviewer has to: names first with the bodies covered, then what \
each assertion would take to fail, then whether the property named on the tin is on that list. The \
case here is the hardest shape — three careful assertions, two of which verify that paging works, \
under a name claiming bulk extraction is impossible. The rule that transfers is that a per-request \
test cannot establish a per-session property, and a name claiming one stops the next person from \
writing the test that would."""

agent_link = """
There is no agent-specific mechanism in this challenge at all. Reading a test for what it actually \
asserts is the same work on a payments API, and the case you examine is a pagination test. The \
connection is only in what the missing control would have bounded: nothing in this repository \
counts a session's calls — `AGENT_MAX_TOOL_CALLS` is set in `.env` and no service source reads it, \
and `rate_limited()` is defined and raised nowhere — so a per-request cap is exactly the control \
that a caller willing to make many requests walks straight past."""

hints = [
  "Read the names first, with the bodies covered. Which one is a statement about the world rather than about a request?",
  "For that case: write down, line by line, what it would take for it to fail. Is the claim in the name on that list?",
  "One of its assertions checks that a mechanism works correctly. What is that mechanism for?",
]

# No controls. This challenge is read-only on purpose: the failure is in the instrument, not the
# system, and arming something would suggest otherwise.
#
# The one observation is the case itself. TS7-09 is named for a property, and the property is
# checkable — so the challenge that is about names claiming more than their assertions should put
# the measurement next to the claim rather than describing it. Nothing is armed to make it work,
# which is the finding: the suite is green against exactly this system.

[[observation]]
observation = "search.enumeration"
label = "Do the thing TS7-09's name says is impossible"
detail = "One two-character query, paged to exhaustion. Every call inside the cap, every call permitted, every call logged as allowed."

[flag]
kind = "written"
label = "which case, and what it actually proves"
rubric = ["TS7-09", "cursor", "cap"]

