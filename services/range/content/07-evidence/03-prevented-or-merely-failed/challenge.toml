id = "7.3-prevented-or-merely-failed"
track = 7
number = "7.3"
title = "Prevented, or merely failed"
points = 30

summary = """
Two write attempts. Both blocked. One was stopped by a control and one was malformed on the way in \
— and reporting the wrong one is how a security report loses its reader."""

objective = """
Two requests below were both refused. Exactly one of them was refused by an authorization control. \
Use the audit trail to decide which, and give the reason code that control recorded."""

skip_test = """
what an audit trail looks like for a request that never reached the authorization pipeline, and why \
that is the most important row in an investigation."""

purpose = """
You practise the distinction a security finding lives or dies on: whether an attempt was refused by \
a control, or fell over before any control was consulted. The method is the trail, not the \
response — a decision row means something decided, and no row usually means the request never \
reached the thing that writes rows. You also read the reason code to tell which layer acted, since \
a denial carrying no policy version was refused by the resource lookup before policy was asked. \
Then you write the paragraph that says what you did not establish."""

agent_link = """
Nothing in this is agent-specific; the same mistake is made with curl, and it is the most common \
error in the field. What an agent changes is rate and review. Calls are made without a person \
reading each one, so refusals accumulate unattended and get counted in bulk — and a count of \
refusals is not a count of controls working. This challenge is the habit that keeps those two \
numbers apart, which matters more the less anyone is watching each call."""

hints = [
  "One of the two produced a decision. What would the other one have produced, and where would it be?",
  "If a request is rejected before identity is established, which layer could possibly have written a row about it?",
  "For the one that was prevented: does its row carry a policy version, and what does the answer tell you about which layer refused?",
]

# Read-only, like the rest of track 7. The trail already holds what this challenge is about; arming
# something would be answering a different question.

[[observation]]
observation = "audit.ord_3001"
label = "Every recorded decision about ORD-3001"
detail = "The cross-tenant read. Look at what was written, and at the policy version column."

[[observation]]
observation = "audit.ord_2001"
label = "Every recorded decision about ORD-2001"
detail = "An order this user may read. Useful as the control group for what a normal row looks like."

[[observation]]
observation = "audit.recent"
label = "The last 30 decisions from the API and the worker"
detail = "The whole trail, newest first. Look for the request that is not here."

[flag]
kind = "reason"
label = "the reason code recorded by the control that acted"
reason_code = "resource_not_visible"

