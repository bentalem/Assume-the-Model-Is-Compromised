id = "7.2-what-the-response-said"
track = 7
number = "7.2"
title = "What the response said"
points = 40

summary = """
A user asks for an order she owns and is told there is no such order. That is not what happened, \
nobody lied, and the only place the truth was written down is a table she cannot see."""

objective = """
Break the policy engine so it answers without a decision, then read alice's request for her own \
order two ways: what the response told the caller, and what the audit trail recorded. Explain why \
an account of the incident built from the first would be wrong, and what it would have got wrong."""

skip_test = """
why a narrated account of what an agent did is never evidence, and which artifact you ask for \
instead."""

hints = [
  "alice owns ORD-2001. With the engine unable to answer, what status does she get, and what would anyone reading that status conclude?",
  "The audit row for that same request carries a different word. Which of the two would a support ticket be written from?",
  "Is the response wrong, or is it correct and insufficient — and does the difference change who you would raise this with?",
]

[[control]]
mutation = "policy.bundle.undefined"
label = "Make the policy engine answer without a decision"
detail = "Shared with 3.4, which is about the failure itself. Here it is only a way to create one."

[[observation]]
observation = "policy.bundle_state"
label = "Which policy the engine is loading"
detail = "Check before and after. `unknown` for this variant means it is armed."

[[observation]]
observation = "api.alice.own_order"
label = "alice asks for an order she owns"
detail = "Run it unarmed first and write the answer down. Then arm, and run it again."

[[observation]]
observation = "audit.ord_2001"
label = "What was recorded about that same request"
detail = "The reason column. Compare it with what the caller was told."

[[observation]]
observation = "audit.recent"
label = "The trail as an investigator first meets it"
detail = "Ungrouped, newest first. The row you want is at the top."

[flag]
kind = "written"
label = "what the response said, what the record said, and which one an account would be built from"
rubric = ["not_found", "policy_malformed", "audit"]

[[source]]
path = "services/api/src/supportpilot_api/pipeline.py"
lines = [146, 156]
highlight = [152, 152]
caption = "The branch that chooses which of two true things the caller is told"

[[source]]
path = "services/api/src/supportpilot_api/errors.py"
lines = [40, 52]
highlight = [47, 52]
caption = "The vocabulary available to a response. Note how much smaller it is than the audit reasons"
